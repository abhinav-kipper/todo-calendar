<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo Calendar</title>
<meta name="description" content="A beautiful calendar-based todo app with cloud sync">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

[data-theme="dark"] {
  --bg-primary: #0d1117; --bg-secondary: #161b22; --bg-tertiary: #1c2128;
  --bg-card: #21262d; --border: #30363d; --border-hover: #484f58;
  --text-primary: #e6edf3; --text-secondary: #8b949e; --text-muted: #484f58;
  --accent: #58a6ff; --accent-dim: #388bfd33;
  --green: #3fb950; --green-bg: #238636; --green-dim: #23863633;
  --red: #f85149; --red-dim: #f8514922;
  --orange: #d29922; --orange-dim: #d2992233;
  --purple: #a371f7;
  --shadow: rgba(0,0,0,0.4); --modal-bg: rgba(0,0,0,0.75);
}

[data-theme="light"] {
  --bg-primary: #ffffff; --bg-secondary: #f6f8fa; --bg-tertiary: #eef1f5;
  --bg-card: #e8ecf0; --border: #d1d9e0; --border-hover: #afb8c1;
  --text-primary: #1f2328; --text-secondary: #59636e; --text-muted: #8c959f;
  --accent: #0969da; --accent-dim: #0969da33;
  --green: #1a7f37; --green-bg: #1a7f37; --green-dim: #1a7f3720;
  --red: #cf222e; --red-dim: #cf222e18;
  --orange: #9a6700; --orange-dim: #9a670020;
  --purple: #8250df;
  --shadow: rgba(0,0,0,0.08); --modal-bg: rgba(0,0,0,0.35);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg-primary); color: var(--text-primary);
  min-height: 100vh; padding: 24px 28px; transition: background 0.3s, color 0.3s;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Focus styles for accessibility */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Header */
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.header-left { display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }

.sync-badge {
  font-size: 0.65rem; padding: 3px 8px; border-radius: 10px;
  background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-dim);
  display: flex; align-items: center; gap: 4px; font-weight: 500;
}
.sync-badge::before { content:''; width:5px; height:5px; background:currentColor; border-radius:50%; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.header-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.nav { display: flex; align-items: center; gap: 4px; }

.btn, .icon-btn {
  background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary);
  padding: 6px 11px; border-radius: 7px; cursor: pointer; font-size: 0.8rem;
  transition: all 0.15s; font-weight: 500; min-height: 32px;
}
.btn:hover, .icon-btn:hover { background: var(--bg-tertiary); border-color: var(--border-hover); }
.icon-btn { padding: 6px 9px; font-size: 0.95rem; line-height: 1; min-width: 32px; text-align: center; }
.nav .month-label { font-size: 1rem; font-weight: 600; min-width: 140px; text-align: center; }
.btn-today { background: var(--accent)!important; border-color: var(--accent)!important; color:#fff!important; }
.btn-active { background: var(--accent-dim)!important; border-color: var(--accent)!important; color: var(--accent)!important; }

/* Toolbar */
.toolbar {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
  padding: 10px 16px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 9px; flex-wrap: wrap;
}
.stat-item { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; color: var(--text-secondary); }
.stat-num { font-size: 0.95rem; font-weight: 700; }
.stat-item.pending .stat-num { color: var(--orange); }
.stat-item.done .stat-num { color: var(--green); }
.stat-item.total .stat-num { color: var(--accent); }
.stat-item.streak .stat-num { color: var(--purple); }

.toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.auth-section { display: flex; align-items: center; gap: 8px; }
.auth-btn {
  display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary);
  font-size: 0.75rem; font-weight: 500; cursor: pointer; transition: all 0.15s; min-height: 32px;
}
.auth-btn:hover { background: var(--bg-tertiary); }
.auth-btn img { width: 13px; height: 13px; }
.user-info { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-secondary); }
.user-avatar { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); }
.sign-out-btn { padding: 3px 8px; border-radius: 5px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-size: 0.65rem; cursor: pointer; min-height: 28px; }
.sign-out-btn:hover { color: var(--red); border-color: var(--red); }

.export-btn { font-size: 0.72rem; padding: 5px 10px; }

/* Weekdays */
.weekdays { display: grid; grid-template-columns: repeat(7,1fr); margin-bottom: 3px; }
.weekdays span { text-align: center; font-size: 0.67rem; font-weight: 600; color: var(--text-muted); padding: 7px 0; text-transform: uppercase; letter-spacing: 0.7px; }

/* Calendar Grid */
.calendar-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }

.day-cell {
  min-height: 85px; background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: 7px; padding: 7px 8px; cursor: pointer; transition: all 0.15s;
  position: relative;
}
.day-cell:hover { background: var(--bg-tertiary); border-color: var(--accent-dim); transform: translateY(-1px); box-shadow: 0 2px 8px var(--shadow); }
.day-cell.today { border-color: var(--accent); }
.day-cell.other-month { opacity: 0.2; pointer-events: none; }
.day-cell.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
.day-cell.has-all-done { border-color: var(--green); }
.day-cell.overdue { border-color: var(--orange); background: var(--orange-dim); }

.day-number { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
.day-cell.today .day-number { color: var(--accent); }
.day-cell.overdue .day-number { color: var(--orange); }

.day-badge { font-size: 0.55rem; padding: 1px 4px; border-radius: 5px; background: var(--accent-dim); color: var(--accent); font-weight: 600; }
.day-cell.has-all-done .day-badge { background: var(--green-dim); color: var(--green); }
.day-cell.overdue .day-badge { background: var(--orange-dim); color: var(--orange); }

.day-todos-preview { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.todo-preview-item {
  display: flex; align-items: center; gap: 4px; font-size: 0.6rem; color: var(--text-secondary);
  line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.todo-preview-item.done { text-decoration: line-through; opacity: 0.4; }
.todo-preview-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.todo-preview-item.done .todo-preview-dot { background: var(--green); }
.todo-preview-item.priority-high .todo-preview-dot { background: var(--red); }
.todo-preview-item.priority-medium .todo-preview-dot { background: var(--orange); }
.todo-overflow { font-size: 0.55rem; color: var(--text-muted); padding-left: 8px; }

/* Quick-add on cell */
.quick-add-input {
  width: calc(100% + 2px); margin: 3px -1px 0; background: var(--bg-primary); border: 1px solid var(--accent);
  color: var(--text-primary); padding: 4px 6px; border-radius: 4px; font-size: 0.65rem;
  outline: none; position: relative; z-index: 2;
}

/* Week View */
.week-view { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
.week-day-col {
  background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px; min-height: 200px; max-height: 70vh; display: flex; flex-direction: column;
}
.week-day-header {
  text-align: center; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--border); cursor: pointer;
}
.week-day-header .day-name { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
.week-day-header .day-num { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); margin-top: 2px; }
.week-day-header.today .day-num { color: var(--accent); }
.week-day-header.overdue .day-num { color: var(--orange); }

.week-todo-list { flex: 1; display: flex; flex-direction: column; gap: 3px; overflow-y: auto; margin-bottom: 8px; }
.week-todo-item {
  display: flex; align-items: center; gap: 6px; padding: 5px 7px;
  background: var(--bg-primary); border-radius: 5px; border: 1px solid var(--border); font-size: 0.7rem;
  cursor: pointer; transition: all 0.15s; min-height: 28px;
}
.week-todo-item:hover { border-color: var(--border-hover); }
.week-todo-item input[type="checkbox"] {
  appearance: none; width: 14px; height: 14px; border: 2px solid var(--border);
  border-radius: 4px; cursor: pointer; flex-shrink: 0; position: relative; transition: all 0.15s;
}
.week-todo-item input[type="checkbox"]:checked { background: var(--green-bg); border-color: var(--green-bg); }
.week-todo-item input[type="checkbox"]:checked::after {
  content:''; position:absolute; left:3px; top:1px; width:4px; height:7px;
  border: solid #fff; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg);
}
.week-todo-item.done .week-todo-text { text-decoration: line-through; color: var(--text-muted); }
.week-todo-text { flex: 1; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; word-break: break-all; }
.week-todo-item .priority-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.week-add-input {
  width: 100%; background: var(--bg-primary); border: 1px solid var(--border);
  color: var(--text-primary); padding: 6px 8px; border-radius: 5px; font-size: 0.7rem;
  outline: none; transition: border-color 0.15s; flex-shrink: 0;
}
.week-add-input:focus { border-color: var(--accent); }
.week-add-input::placeholder { color: var(--text-muted); }

.recurring-badge { font-size: 0.55rem; color: var(--purple); margin-left: 3px; }

/* Side Panel */
.panel-overlay { position:fixed; inset:0; background:var(--modal-bg); backdrop-filter:blur(5px); display:none; z-index:100; }
.panel-overlay.open { display:block; animation:fadeIn 0.2s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }

.panel {
  position:fixed; top:0; right:0; width:420px; max-width:92vw; height:100vh;
  background:var(--bg-primary); border-left:1px solid var(--border);
  display:flex; flex-direction:column; box-shadow:-6px 0 24px var(--shadow);
  animation:slideIn 0.22s ease; z-index:101;
}
.panel[role="dialog"] { /* aria */ }

.panel-header { padding: 24px 24px 16px; border-bottom: 1px solid var(--border); }
.panel-header-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
.panel-header h2 { font-size:1.2rem; font-weight:700; }
.panel-header-sub { font-size:0.75rem; color:var(--text-muted); margin-top:3px; }
.panel-close {
  background:var(--bg-secondary); border:1px solid var(--border); color:var(--text-secondary);
  width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  border-radius:7px; cursor:pointer; font-size:0.95rem; transition:all 0.15s; min-width:32px;
}
.panel-close:hover { background:var(--bg-tertiary); color:var(--text-primary); }

.panel-progress { padding:10px 14px; background:var(--bg-secondary); border-radius:8px; display:flex; align-items:center; gap:12px; }
.progress-ring { width:40px; height:40px; flex-shrink:0; }
.progress-ring circle { fill:none; stroke-width:4; }
.progress-ring .bg { stroke:var(--border); }
.progress-ring .fill { stroke-linecap:round; transition:stroke-dashoffset 0.5s ease; }
.progress-text { display:flex; flex-direction:column; gap:1px; }
.progress-text .pct { font-size:1rem; font-weight:700; }
.progress-text .label { font-size:0.68rem; color:var(--text-muted); }

.panel-body { flex:1; overflow-y:auto; padding:20px 24px; }

/* Add form */
.add-todo-form { margin-bottom:20px; }
.add-todo-input-row { display:flex; gap:7px; margin-bottom:8px; }
.add-todo-input-row input {
  flex:1; background:var(--bg-secondary); border:1px solid var(--border); color:var(--text-primary);
  padding:10px 14px; border-radius:8px; font-size:0.85rem; outline:none; transition:all 0.15s;
}
.add-todo-input-row input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
.add-todo-input-row input::placeholder { color:var(--text-muted); }
.add-todo-input-row button {
  background:var(--green-bg); border:none; color:#fff; padding:10px 18px;
  border-radius:8px; cursor:pointer; font-size:0.82rem; font-weight:600; transition:all 0.15s;
}
.add-todo-input-row button:hover { opacity:0.9; }

.add-options { display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
.add-options span { font-size:0.68rem; color:var(--text-muted); }
.priority-btn, .repeat-btn {
  padding:4px 9px; border-radius:12px; border:1px solid var(--border); background:var(--bg-secondary);
  color:var(--text-secondary); font-size:0.65rem; cursor:pointer; transition:all 0.15s; font-weight:500;
}
.priority-btn.active { border-color:transparent; }
.priority-btn.low.active { background:var(--accent-dim); color:var(--accent); }
.priority-btn.medium.active { background:var(--orange-dim); color:var(--orange); }
.priority-btn.high.active { background:var(--red-dim); color:var(--red); }
.repeat-btn.active { background:var(--accent-dim); color:var(--accent); border-color:transparent; }
.options-divider { width:1px; height:14px; background:var(--border); margin:0 3px; }

/* Todo list */
.todo-section-label { font-size:0.65rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; padding-left:2px; }
.todo-list { display:flex; flex-direction:column; gap:5px; margin-bottom:16px; }

.todo-item {
  display:flex; align-items:flex-start; gap:10px; padding:11px 13px;
  background:var(--bg-secondary); border-radius:8px; border:1px solid var(--border); transition:all 0.15s;
  cursor:grab; user-select:none;
}
.todo-item:hover { border-color:var(--border-hover); box-shadow:0 2px 6px var(--shadow); }
.todo-item.dragging { opacity:0.4; cursor:grabbing; }
.todo-item.drag-over { border-color:var(--accent); border-style:dashed; }

.todo-item input[type="checkbox"] {
  appearance:none; width:20px; height:20px; border:2px solid var(--border); border-radius:5px;
  cursor:pointer; flex-shrink:0; margin-top:1px; transition:all 0.2s; position:relative;
}
.todo-item input[type="checkbox"]:hover { border-color:var(--green); }
.todo-item input[type="checkbox"]:checked { background:var(--green-bg); border-color:var(--green-bg); }
.todo-item input[type="checkbox"]:checked::after {
  content:''; position:absolute; left:5px; top:2px; width:5px; height:9px;
  border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg);
}
.todo-item-content { flex:1; display:flex; flex-direction:column; gap:3px; min-width:0; }
.todo-item .todo-text {
  font-size:0.88rem; font-weight:500; color:var(--text-primary); line-height:1.4;
  overflow-wrap:break-word; word-break:break-word;
}
.todo-item.done .todo-text { text-decoration:line-through; color:var(--text-muted); font-weight:400; }
.todo-item .todo-meta { display:flex; align-items:center; gap:6px; font-size:0.65rem; color:var(--text-muted); flex-wrap:wrap; }
.priority-tag { font-size:0.57rem; padding:2px 6px; border-radius:5px; font-weight:600; text-transform:uppercase; }
.priority-tag.high { background:var(--red-dim); color:var(--red); }
.priority-tag.medium { background:var(--orange-dim); color:var(--orange); }

/* Delete button - visible on mobile always, hover on desktop */
.todo-item .delete-btn {
  background:none; border:none; color:var(--text-muted); cursor:pointer;
  font-size:0.85rem; padding:4px 7px; border-radius:5px; transition:all 0.15s; flex-shrink:0; margin-top:1px;
}
.todo-item .delete-btn:hover { color:var(--red); background:var(--red-dim); }

@media (hover:hover) {
  .todo-item .delete-btn { opacity:0; }
  .todo-item:hover .delete-btn { opacity:1; }
}

.empty-state { text-align:center; color:var(--text-muted); padding:36px 0; font-size:0.85rem; }
.empty-state-icon { font-size:2rem; margin-bottom:8px; opacity:0.3; }

/* Panel footer */
.panel-footer { padding:12px 24px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.keyboard-hint { font-size:0.63rem; color:var(--text-muted); }
kbd { background:var(--bg-card); border:1px solid var(--border); padding:1px 4px; border-radius:3px; font-size:0.6rem; font-family:inherit; }
.panel-nav { display:flex; gap:3px; }
.panel-nav button { background:var(--bg-secondary); border:1px solid var(--border); color:var(--text-secondary); padding:5px 10px; border-radius:5px; cursor:pointer; font-size:0.75rem; transition:all 0.15s; min-height:28px; }
.panel-nav button:hover { background:var(--bg-tertiary); color:var(--text-primary); }

/* Responsive */
@media (max-width:900px) {
  body { padding:12px; }
  .day-cell { min-height:58px; padding:5px; }
  .todo-preview-item { display:none; }
  .toolbar { gap:8px; }
  .panel { width:100%; max-width:100%; }
  .week-view { grid-template-columns: repeat(2, 1fr); }
  .week-day-col { min-height: 150px; max-height: 50vh; }
}
@media (max-width:600px) {
  .header { flex-direction:column; align-items:stretch; }
  .header-right { justify-content: center; }
  .day-cell { min-height:44px; padding:3px; border-radius:5px; }
  .day-number { font-size:0.65rem; }
  .week-view { grid-template-columns: 1fr; }
  .week-day-col { min-height: 100px; max-height: 40vh; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Todo Calendar</h1>
    <div class="sync-badge" id="syncBadge" aria-live="polite">Local</div>
  </div>
  <div class="header-right">
    <div class="nav">
      <button class="btn" onclick="changeMonth(-1)" aria-label="Previous">&#8592;</button>
      <span class="month-label" id="monthLabel"></span>
      <button class="btn" onclick="changeMonth(1)" aria-label="Next">&#8594;</button>
      <button class="btn btn-today" onclick="goToday()">Today</button>
    </div>
    <button class="btn" id="viewMonthBtn" onclick="setView('month')">Month</button>
    <button class="btn" id="viewWeekBtn" onclick="setView('week')">Week</button>
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle theme">&#9790;</button>
  </div>
</div>

<div class="toolbar">
  <div class="stat-item total"><span class="stat-num" id="statTotal">0</span> this month</div>
  <div class="stat-item pending"><span class="stat-num" id="statPending">0</span> pending</div>
  <div class="stat-item done"><span class="stat-num" id="statDone">0</span> done</div>
  <div class="stat-item streak"><span class="stat-num" id="statStreak">0</span> streak</div>
  <div class="toolbar-right">
    <button class="btn export-btn" onclick="exportData()">Export</button>
    <label class="btn export-btn" style="cursor:pointer">Import<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>
    <div class="auth-section" id="authSection">
      <button class="auth-btn" onclick="signInWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt=""> Sign in
      </button>
    </div>
  </div>
</div>

<div id="monthView">
  <div class="weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
  <div class="calendar-grid" id="calendarGrid"></div>
</div>

<div id="weekView" style="display:none">
  <div class="week-view" id="weekGrid"></div>
</div>

<!-- Side Panel -->
<div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>
<div class="panel" id="panel" style="display:none" role="dialog" aria-modal="true" aria-label="Day todos">
  <div class="panel-header">
    <div class="panel-header-top">
      <div><h2 id="panelTitle">Tuesday</h2><div class="panel-header-sub" id="panelSub"></div></div>
      <button class="panel-close" onclick="closePanel()" aria-label="Close panel">&#10005;</button>
    </div>
    <div id="progressSection"></div>
  </div>
  <div class="panel-body">
    <div class="add-todo-form">
      <div class="add-todo-input-row">
        <input type="text" id="todoInput" placeholder="Add a task..." onkeydown="handleInputKey(event)" maxlength="500" aria-label="New task text">
        <button onclick="addTodo()">Add</button>
      </div>
      <div class="add-options">
        <span>Priority:</span>
        <button class="priority-btn low active" onclick="setPriority('low')">Low</button>
        <button class="priority-btn medium" onclick="setPriority('medium')">Med</button>
        <button class="priority-btn high" onclick="setPriority('high')">High</button>
        <div class="options-divider"></div>
        <span>Repeat:</span>
        <button class="repeat-btn active" data-r="none" onclick="setRepeat('none')">None</button>
        <button class="repeat-btn" data-r="daily" onclick="setRepeat('daily')">Daily</button>
        <button class="repeat-btn" data-r="weekdays" onclick="setRepeat('weekdays')">Weekdays</button>
        <button class="repeat-btn" data-r="weekly" onclick="setRepeat('weekly')">Weekly</button>
      </div>
    </div>
    <div id="todoListContainer"></div>
  </div>
  <div class="panel-footer">
    <div class="keyboard-hint"><kbd>Enter</kbd> add &middot; <kbd>Esc</kbd> close</div>
    <div class="panel-nav">
      <button onclick="navDay(-1)" aria-label="Previous day">&#8592; Prev</button>
      <button onclick="navDay(1)" aria-label="Next day">Next &#8594;</button>
    </div>
  </div>
</div>

<script>
// --- Firebase ---
firebase.initializeApp({
  apiKey:"AIzaSyAMWjbYB6-uWEDHLIXc4wDUmT23vxor2kk",authDomain:"todo-calendar-dde90.firebaseapp.com",
  projectId:"todo-calendar-dde90",storageBucket:"todo-calendar-dde90.firebasestorage.app",
  messagingSenderId:"791175432633",appId:"1:791175432633:web:8a95bfd236fe74f2b10e68"
});
const auth=firebase.auth(), db=firebase.firestore();
let currentUser=null;

// --- Theme ---
function toggleTheme(){
  const h=document.documentElement, n=h.dataset.theme==='dark'?'light':'dark';
  h.dataset.theme=n; localStorage.setItem('todo-cal-theme',n);
  document.getElementById('themeBtn').innerHTML=n==='dark'?'&#9790;':'&#9728;';
}
(function(){const s=localStorage.getItem('todo-cal-theme');if(s){document.documentElement.dataset.theme=s;document.getElementById('themeBtn').innerHTML=s==='dark'?'&#9790;':'&#9728;';}})();

// --- Auth ---
function signInWithGoogle(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>alert('Sign-in failed: '+e.message));}
function signOut(){auth.signOut();}
auth.onAuthStateChanged(user=>{
  currentUser=user;const s=document.getElementById('authSection');
  if(user){s.innerHTML=`<div class="user-info"><img class="user-avatar" src="${user.photoURL||''}" alt=""><span>${user.displayName||user.email}</span></div><button class="sign-out-btn" onclick="signOut()">Sign out</button>`;showSyncStatus('Synced');loadTodos();}
  else{s.innerHTML=`<button class="auth-btn" onclick="signInWithGoogle()"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt=""> Sign in</button>`;showSyncStatus('Local');loadTodos();}
});

// --- State ---
let currentDate=new Date(), selectedDate=null, currentPriority='low', currentRepeat='none';
let todos={}, recurring=[], saveTimeout=null, currentView='month';
let todosForDayCache={}, cacheVersion=0;

// --- Persistence ---
async function loadTodos(){
  if(currentUser){
    try{const doc=await db.collection('users').doc(currentUser.uid).get();
      if(doc.exists){const d=doc.data();todos=d.todos||{};recurring=d.recurring||[];}
      else{todos=JSON.parse(localStorage.getItem('todo-calendar-data')||'{}');recurring=JSON.parse(localStorage.getItem('todo-calendar-recurring')||'[]');
        if(Object.keys(todos).length>0||recurring.length>0)await db.collection('users').doc(currentUser.uid).set({todos,recurring});}
      showSyncStatus('Synced');
    }catch(e){todos=JSON.parse(localStorage.getItem('todo-calendar-data')||'{}');recurring=JSON.parse(localStorage.getItem('todo-calendar-recurring')||'[]');showSyncStatus('Offline');}
  }else{todos=JSON.parse(localStorage.getItem('todo-calendar-data')||'{}');recurring=JSON.parse(localStorage.getItem('todo-calendar-recurring')||'[]');}
  invalidateCache(); render();
}

function saveTodos(){
  clearTimeout(saveTimeout);
  invalidateCache();
  saveTimeout=setTimeout(async()=>{
    localStorage.setItem('todo-calendar-data',JSON.stringify(todos));
    localStorage.setItem('todo-calendar-recurring',JSON.stringify(recurring));
    if(currentUser){try{await db.collection('users').doc(currentUser.uid).set({todos,recurring});showSyncStatus('Synced');}catch(e){showSyncStatus('Offline');}}
  },500);
}

function showSyncStatus(t){const b=document.getElementById('syncBadge');b.textContent=t;
  if(t==='Synced'){b.style.color='var(--green)';b.style.background='var(--green-dim)';}
  else if(t==='Local'){b.style.color='var(--accent)';b.style.background='var(--accent-dim)';}
  else{b.style.color='var(--orange)';b.style.background='var(--orange-dim)';}
}

// --- Export/Import ---
function exportData(){
  const data=JSON.stringify({todos,recurring},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`todo-calendar-backup-${dateKey(new Date())}.json`;a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  if(!confirm('This will replace all your current data. Continue?'))return;
  const reader=new FileReader();
  reader.onload=ev=>{try{const d=JSON.parse(ev.target.result);todos=d.todos||{};recurring=d.recurring||[];saveTodos();render();alert('Import successful!');}catch(err){alert('Invalid file format');}};
  reader.readAsText(file);e.target.value='';
}

// --- Cache ---
function invalidateCache(){cacheVersion++;todosForDayCache={};}

function getTodosForDay(key){
  const cacheKey=key+'_'+cacheVersion;
  if(todosForDayCache[cacheKey])return todosForDayCache[cacheKey];

  const base=(todos[key]||[]).filter(t=>!t.recurringId);
  const d=new Date(key+'T12:00:00'); // noon to avoid DST issues
  const dow=d.getDay();

  const recTodos=recurring.filter(r=>{
    const start=new Date(r.startDate+'T12:00:00');
    if(d<start)return false;
    if(r.repeat==='daily')return true;
    if(r.repeat==='weekdays')return dow>=1&&dow<=5;
    if(r.repeat==='weekly')return dow===start.getDay();
    return false;
  }).map(r=>{
    const doneMarker=(todos[key]||[]).find(t=>t.recurringId===r.id);
    return{...r, isRecurring:true, done:!!(doneMarker&&doneMarker.done)};
  });

  const result=[...base,...recTodos];
  todosForDayCache[cacheKey]=result;
  return result;
}

function isOverdue(key){
  const today=new Date();today.setHours(0,0,0,0);
  const d=new Date(key+'T12:00:00');
  if(d>=today)return false;
  const dayTodos=getTodosForDay(key);
  return dayTodos.length>0&&dayTodos.some(t=>!t.done);
}

// --- Helpers ---
function dateKey(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getRelativeDay(key){const today=new Date();today.setHours(0,0,0,0);const d=new Date(key+'T12:00:00');const diff=Math.round((d-today)/86400000);if(diff===0)return'Today';if(diff===1)return'Tomorrow';if(diff===-1)return'Yesterday';return'';}

// --- Stats ---
function updateStats(){
  const year=currentDate.getFullYear(),month=currentDate.getMonth();
  let total=0,done=0;
  const daysInMonth=new Date(year,month+1,0).getDate();
  for(let i=1;i<=daysInMonth;i++){
    const key=dateKey(new Date(year,month,i));
    const dt=getTodosForDay(key);
    total+=dt.length; done+=dt.filter(t=>t.done).length;
  }
  document.getElementById('statTotal').textContent=total;
  document.getElementById('statPending').textContent=total-done;
  document.getElementById('statDone').textContent=done;
  document.getElementById('statStreak').textContent=calculateStreak();
}

function calculateStreak(){
  let streak=0;const today=new Date();today.setHours(0,0,0,0);let d=new Date(today);
  let empty=0;
  for(let i=0;i<60;i++){
    const key=dateKey(d);const items=getTodosForDay(key);
    if(items.length>0&&items.every(t=>t.done)){streak++;empty=0;}
    else if(items.length>0)break;
    else{empty++;if(empty>7)break;} // break streak after 7 consecutive empty days
    d.setDate(d.getDate()-1);
  }
  return streak;
}

// --- Views ---
function setView(v){
  currentView=v;
  document.getElementById('monthView').style.display=v==='month'?'block':'none';
  document.getElementById('weekView').style.display=v==='week'?'block':'none';
  document.getElementById('viewMonthBtn').classList.toggle('btn-active',v==='month');
  document.getElementById('viewWeekBtn').classList.toggle('btn-active',v==='week');
  render();
}

function render(){
  if(currentView==='month')renderCalendar();
  else renderWeekView();
  updateStats();
}

// --- Month View ---
function renderCalendar(){
  const grid=document.getElementById('calendarGrid');
  const year=currentDate.getFullYear(),month=currentDate.getMonth();
  document.getElementById('monthLabel').textContent=new Date(year,month).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const firstDay=new Date(year,month,1).getDay(),daysInMonth=new Date(year,month+1,0).getDate(),daysInPrev=new Date(year,month,0).getDate();
  const today=new Date();let html='';
  for(let i=firstDay-1;i>=0;i--)html+=buildDayCell(new Date(year,month-1,daysInPrev-i),daysInPrev-i,true,today);
  for(let i=1;i<=daysInMonth;i++)html+=buildDayCell(new Date(year,month,i),i,false,today);
  const total=Math.ceil((firstDay+daysInMonth)/7)*7;
  for(let i=1;i<=total-(firstDay+daysInMonth);i++)html+=buildDayCell(new Date(year,month+1,i),i,true,today);
  grid.innerHTML=html;
}

let clickTimer=null;
function handleDayClick(key){
  if(clickTimer){clearTimeout(clickTimer);clickTimer=null;return;} // dblclick handled it
  clickTimer=setTimeout(()=>{clickTimer=null;openDay(key);},250);
}
function handleDayDblClick(e,key){
  if(clickTimer){clearTimeout(clickTimer);clickTimer=null;}
  quickAdd(e,key);
}

function buildDayCell(date,dayNum,otherMonth,today){
  const key=dateKey(date),dayTodos=getTodosForDay(key);
  const isToday=date.toDateString()===today.toDateString();
  const isSelected=selectedDate&&date.toDateString()===selectedDate.toDateString();
  const hasTodos=dayTodos.length>0,allDone=hasTodos&&dayTodos.every(t=>t.done);
  const overdue=!otherMonth&&isOverdue(key);

  let cls='day-cell';
  if(otherMonth)cls+=' other-month';if(isToday)cls+=' today';if(isSelected)cls+=' selected';
  if(hasTodos)cls+=' has-todos';if(allDone)cls+=' has-all-done';if(overdue)cls+=' overdue';

  let badge='';if(hasTodos){const dc=dayTodos.filter(t=>t.done).length;badge=`<span class="day-badge">${dc}/${dayTodos.length}</span>`;}

  let preview='';
  dayTodos.slice(0,3).forEach(t=>{
    const d=t.done?' done':'',p=t.priority!=='low'?` priority-${t.priority}`:'';
    const txt=t.text.length>14?t.text.slice(0,14)+'\u2026':t.text;
    const rec=t.isRecurring?'<span class="recurring-badge">&#8635;</span>':'';
    preview+=`<div class="todo-preview-item${d}${p}"><span class="todo-preview-dot"></span>${escapeHtml(txt)}${rec}</div>`;
  });
  if(dayTodos.length>3)preview+=`<div class="todo-overflow">+${dayTodos.length-3} more</div>`;

  return`<div class="${cls}" onclick="handleDayClick('${key}')" ondblclick="handleDayDblClick(event,'${key}')"><div class="day-number">${dayNum}${badge}</div><div class="day-todos-preview">${preview}</div></div>`;
}

function quickAdd(e,key){
  e.stopPropagation();
  const cell=e.currentTarget;
  if(cell.querySelector('.quick-add-input'))return;
  const input=document.createElement('input');
  input.className='quick-add-input';input.placeholder='Quick add...';input.maxLength=500;
  input.onkeydown=ev=>{
    if(ev.key==='Enter'&&input.value.trim()){
      if(!todos[key])todos[key]=[];
      todos[key].push({text:input.value.trim(),done:false,priority:'low',created:new Date().toISOString()});
      saveTodos();render();
    }
    if(ev.key==='Escape'||ev.key==='Enter'){ev.stopPropagation();input.remove();}
  };
  input.onblur=()=>setTimeout(()=>input.remove(),100);
  cell.appendChild(input);input.focus();
}

// --- Week View ---
function renderWeekView(){
  const grid=document.getElementById('weekGrid');
  const today=new Date();today.setHours(0,0,0,0);
  const startOfWeek=new Date(currentDate);
  startOfWeek.setDate(startOfWeek.getDate()-startOfWeek.getDay());

  document.getElementById('monthLabel').textContent=startOfWeek.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' \u2013 '+
    new Date(startOfWeek.getTime()+6*86400000).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

  let html='';
  for(let i=0;i<7;i++){
    const d=new Date(startOfWeek);d.setDate(d.getDate()+i);
    const key=dateKey(d);
    const dayTodos=getTodosForDay(key);
    const isToday=d.toDateString()===today.toDateString();
    const overdue=isOverdue(key);
    const headerCls=isToday?' today':overdue?' overdue':'';

    html+=`<div class="week-day-col">
      <div class="week-day-header${headerCls}" onclick="openDay('${key}')">
        <div class="day-name">${d.toLocaleDateString('en-US',{weekday:'short'})}</div>
        <div class="day-num">${d.getDate()}</div>
      </div>
      <div class="week-todo-list">`;

    dayTodos.slice(0,15).forEach((t,idx)=>{
      const doneCls=t.done?' done':'';
      const prioColor=t.priority==='high'?'var(--red)':t.priority==='medium'?'var(--orange)':'var(--accent)';
      html+=`<div class="week-todo-item${doneCls}">
        <input type="checkbox" ${t.done?'checked':''} onchange="toggleWeekTodo('${key}',${idx},${!!t.isRecurring},'${t.id||''}')" aria-label="${escapeHtml(t.text)}">
        <span class="week-todo-text">${escapeHtml(t.text)}</span>
        <span class="priority-dot" style="background:${prioColor}"></span>
      </div>`;
    });
    if(dayTodos.length>15)html+=`<div style="font-size:0.6rem;color:var(--text-muted);text-align:center;padding:3px">+${dayTodos.length-15} more</div>`;

    html+=`</div><input class="week-add-input" placeholder="+ Add" onkeydown="weekQuickAdd(event,'${key}')" aria-label="Quick add todo for ${d.toLocaleDateString('en-US',{weekday:'short'})}"></div>`;
  }
  grid.innerHTML=html;
}

function weekQuickAdd(e,key){
  if(e.key!=='Enter'||!e.target.value.trim())return;
  if(!todos[key])todos[key]=[];
  todos[key].push({text:e.target.value.trim(),done:false,priority:'low',created:new Date().toISOString()});
  e.target.value='';
  saveTodos();render();
}

function toggleWeekTodo(key,index,isRecurring,recurringId){
  if(isRecurring){
    if(!todos[key])todos[key]=[];
    const existing=todos[key].find(t=>t.recurringId===recurringId);
    if(existing)existing.done=!existing.done;
    else todos[key].push({recurringId,done:true,text:'',priority:'low'});
  }else{
    const baseTodos=(todos[key]||[]).filter(t=>!t.recurringId);
    if(baseTodos[index])baseTodos[index].done=!baseTodos[index].done;
  }
  saveTodos();render();
}

// --- Panel ---
function openDay(key){
  selectedDate=new Date(key+'T12:00:00');
  document.getElementById('panelOverlay').classList.add('open');
  document.getElementById('panel').style.display='flex';
  const d=selectedDate;
  document.getElementById('panelTitle').textContent=d.toLocaleDateString('en-US',{weekday:'long'});
  const sub=d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  const rel=getRelativeDay(key);
  document.getElementById('panelSub').textContent=rel?`${sub} \u2022 ${rel}`:sub;
  renderProgress(key);renderPanelTodoList(key);render();
  setTimeout(()=>document.getElementById('todoInput').focus(),150);
}

function closePanel(){document.getElementById('panelOverlay').classList.remove('open');document.getElementById('panel').style.display='none';selectedDate=null;render();}
function navDay(delta){if(!selectedDate)return;selectedDate.setDate(selectedDate.getDate()+delta);openDay(dateKey(selectedDate));}

function renderProgress(key){
  const dayTodos=getTodosForDay(key),section=document.getElementById('progressSection');
  if(dayTodos.length===0){section.innerHTML='';return;}
  const done=dayTodos.filter(t=>t.done).length,pct=Math.round((done/dayTodos.length)*100);
  const circ=2*Math.PI*18,offset=circ-(pct/100)*circ;
  // Color: green if >50%, orange if >0%, muted if 0%
  const color=pct>=50?'var(--green)':pct>0?'var(--orange)':'var(--text-muted)';
  section.innerHTML=`<div class="panel-progress"><svg class="progress-ring" viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="18"/><circle class="fill" cx="22" cy="22" r="18" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" transform="rotate(-90 22 22)" style="stroke:${color}"/></svg><div class="progress-text"><span class="pct" style="color:${color}">${pct}%</span><span class="label">${done} of ${dayTodos.length} done</span></div></div>`;
}

function renderPanelTodoList(key){
  const dayTodos=getTodosForDay(key),container=document.getElementById('todoListContainer');
  if(dayTodos.length===0){container.innerHTML=`<div class="empty-state"><div class="empty-state-icon">&#9744;</div>No tasks yet. Add one above!</div>`;return;}

  // Build indexed array referencing back to real positions in todos[key]
  const baseItems=(todos[key]||[]).filter(t=>!t.recurringId);
  const recItems=dayTodos.filter(t=>t.isRecurring);

  const undone=[...baseItems.map((t,i)=>({...t,realIdx:i,isRec:false})).filter(t=>!t.done),
                ...recItems.filter(t=>!t.done).map(t=>({...t,realIdx:-1,isRec:true}))];
  const doneArr=[...baseItems.map((t,i)=>({...t,realIdx:i,isRec:false})).filter(t=>t.done),
                 ...recItems.filter(t=>t.done).map(t=>({...t,realIdx:-1,isRec:true}))];

  const prioOrder={high:0,medium:1,low:2};
  undone.sort((a,b)=>(prioOrder[a.priority]||2)-(prioOrder[b.priority]||2));

  let html='';
  if(undone.length>0){html+=`<div class="todo-section-label">To do (${undone.length})</div><div class="todo-list" data-key="${key}" data-section="undone">`;html+=undone.map(t=>renderPanelTodoItem(key,t)).join('');html+='</div>';}
  if(doneArr.length>0){html+=`<div class="todo-section-label">Completed (${doneArr.length})</div><div class="todo-list">`;html+=doneArr.map(t=>renderPanelTodoItem(key,t)).join('');html+='</div>';}
  container.innerHTML=html;
  initDragDrop(key);
}

function renderPanelTodoItem(key,todo){
  const prioTag=todo.priority!=='low'?`<span class="priority-tag ${todo.priority}">${todo.priority}</span>`:'';
  const timeStr=todo.created?new Date(todo.created).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';
  const recBadge=todo.isRec?`<span class="recurring-badge">&#8635; ${todo.repeat||''}</span>`:'';
  const delBtn=todo.isRec
    ?`<button class="delete-btn" onclick="deleteRecurring('${todo.id}')" aria-label="Delete recurring task">&#10005;</button>`
    :`<button class="delete-btn" onclick="deleteTodo('${key}',${todo.realIdx})" aria-label="Delete task">&#10005;</button>`;

  return`<div class="todo-item${todo.done?' done':''}" draggable="${!todo.isRec}" data-real-idx="${todo.realIdx}" data-key="${key}">
    <input type="checkbox" ${todo.done?'checked':''} onchange="toggleTodo('${key}',${todo.realIdx},${todo.isRec},'${todo.id||''}')" aria-label="${escapeHtml(todo.text)}">
    <div class="todo-item-content"><span class="todo-text">${escapeHtml(todo.text)}</span><div class="todo-meta">${prioTag}${recBadge}<span>${timeStr}</span></div></div>
    ${delBtn}
  </div>`;
}

// --- Drag & Drop (fixed: uses realIdx into todos[key] base array) ---
function initDragDrop(key){
  const lists=document.querySelectorAll('.todo-list[data-section="undone"]');
  lists.forEach(list=>{
    const items=list.querySelectorAll('.todo-item[draggable="true"]');
    items.forEach(item=>{
      item.addEventListener('dragstart',e=>{
        item.classList.add('dragging');
        e.dataTransfer.setData('text/plain',item.dataset.realIdx);
        e.dataTransfer.effectAllowed='move';
      });
      item.addEventListener('dragend',()=>item.classList.remove('dragging'));
      item.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';item.classList.add('drag-over');});
      item.addEventListener('dragleave',()=>item.classList.remove('drag-over'));
      item.addEventListener('drop',e=>{
        e.preventDefault();item.classList.remove('drag-over');
        const fromIdx=parseInt(e.dataTransfer.getData('text/plain'));
        const toIdx=parseInt(item.dataset.realIdx);
        if(isNaN(fromIdx)||isNaN(toIdx)||fromIdx<0||toIdx<0||fromIdx===toIdx)return;
        const arr=(todos[key]||[]).filter(t=>!t.recurringId);
        if(fromIdx>=arr.length||toIdx>=arr.length)return;
        // Reorder within the non-recurring items
        const allItems=todos[key]||[];
        const nonRecIndices=[];
        allItems.forEach((t,i)=>{if(!t.recurringId)nonRecIndices.push(i);});
        const realFrom=nonRecIndices[fromIdx], realTo=nonRecIndices[toIdx];
        if(realFrom===undefined||realTo===undefined)return;
        const el=allItems.splice(realFrom,1)[0];
        const adjustedTo=realTo>realFrom?realTo-1:realTo;
        allItems.splice(adjustedTo,0,el);
        todos[key]=allItems;
        saveTodos();renderPanelTodoList(key);
      });
    });
  });
}

// --- Actions ---
function addTodo(){
  const input=document.getElementById('todoInput'),text=input.value.trim();
  if(!text||!selectedDate)return;
  const key=dateKey(selectedDate);

  if(currentRepeat!=='none'){
    recurring.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text,priority:currentPriority,repeat:currentRepeat,startDate:key,created:new Date().toISOString()});
  }else{
    if(!todos[key])todos[key]=[];
    todos[key].push({text,done:false,priority:currentPriority,created:new Date().toISOString()});
  }
  saveTodos();input.value='';renderProgress(key);renderPanelTodoList(key);render();
}

function toggleTodo(key,realIdx,isRecurring,recurringId){
  if(isRecurring){
    if(!todos[key])todos[key]=[];
    const existing=todos[key].find(t=>t.recurringId===recurringId);
    if(existing)existing.done=!existing.done;
    else todos[key].push({recurringId,done:true,text:'',priority:'low'});
  }else{
    const nonRec=(todos[key]||[]).filter(t=>!t.recurringId);
    if(nonRec[realIdx])nonRec[realIdx].done=!nonRec[realIdx].done;
  }
  saveTodos();renderProgress(key);renderPanelTodoList(key);render();
}

function deleteTodo(key,realIdx){
  if(!todos[key])return;
  const nonRecIndices=[];
  todos[key].forEach((t,i)=>{if(!t.recurringId)nonRecIndices.push(i);});
  const actualIdx=nonRecIndices[realIdx];
  if(actualIdx===undefined)return;
  todos[key].splice(actualIdx,1);
  if(todos[key].length===0)delete todos[key];
  saveTodos();renderProgress(key);renderPanelTodoList(key);render();
}

function deleteRecurring(id){
  recurring=recurring.filter(r=>r.id!==id);
  // Clean up done markers for this recurring
  Object.keys(todos).forEach(k=>{
    todos[k]=(todos[k]||[]).filter(t=>t.recurringId!==id);
    if(todos[k].length===0)delete todos[k];
  });
  saveTodos();
  if(selectedDate){const key=dateKey(selectedDate);renderProgress(key);renderPanelTodoList(key);}
  render();
}

function setPriority(p){currentPriority=p;document.querySelectorAll('.priority-btn').forEach(b=>b.classList.toggle('active',b.classList.contains(p)));}
function setRepeat(r){currentRepeat=r;document.querySelectorAll('.repeat-btn').forEach(b=>b.classList.toggle('active',b.dataset.r===r));}

function changeMonth(delta){
  if(currentView==='week')currentDate.setDate(currentDate.getDate()+delta*7);
  else currentDate.setMonth(currentDate.getMonth()+delta);
  render();
}
function goToday(){currentDate=new Date();render();}
function handleInputKey(e){if(e.key==='Enter')addTodo();}

// Keyboard - only nav when focus is not in an input
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closePanel();
  const isInput=e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable;
  if(selectedDate&&document.getElementById('panel').style.display==='flex'&&!isInput){
    if(e.key==='ArrowLeft'){e.preventDefault();navDay(-1);}
    if(e.key==='ArrowRight'){e.preventDefault();navDay(1);}
  }
});

setView('month');
</script>
</body>

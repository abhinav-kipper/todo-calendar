<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

[data-theme="dark"] {
  --bg-primary: #0a0e14; --bg-secondary: #12171f; --bg-tertiary: #1a2030;
  --bg-card: #1e2636; --bg-glass: rgba(18,23,31,0.8);
  --border: #2a3444; --border-hover: #3d4f66;
  --text-primary: #e8edf5; --text-secondary: #8b9ab5; --text-muted: #4a5a72;
  --accent: #6ea8fe; --accent-dim: #6ea8fe25; --accent-glow: #6ea8fe40;
  --green: #5cdb7f; --green-bg: #2d8b4e; --green-dim: #2d8b4e30; --green-glow: #5cdb7f30;
  --red: #ff6b6b; --red-dim: #ff6b6b20; --orange: #ffb347; --orange-dim: #ffb34720;
  --purple: #b88cff; --purple-dim: #b88cff25;
  --gradient-accent: linear-gradient(135deg, #6ea8fe, #b88cff);
  --gradient-green: linear-gradient(135deg, #5cdb7f, #47d4a0);
  --gradient-warm: linear-gradient(135deg, #ffb347, #ff6b6b);
  --shadow: rgba(0,0,0,0.5); --shadow-lg: rgba(0,0,0,0.7);
  --modal-bg: rgba(5,8,12,0.85);
}

[data-theme="light"] {
  --bg-primary: #f8fafb; --bg-secondary: #ffffff; --bg-tertiary: #f0f4f8;
  --bg-card: #e8eef4; --bg-glass: rgba(255,255,255,0.85);
  --border: #dce3eb; --border-hover: #b8c4d0;
  --text-primary: #1a2332; --text-secondary: #5a6a7e; --text-muted: #94a3b8;
  --accent: #3b82f6; --accent-dim: #3b82f620; --accent-glow: #3b82f630;
  --green: #22c55e; --green-bg: #16a34a; --green-dim: #22c55e18; --green-glow: #22c55e25;
  --red: #ef4444; --red-dim: #ef444415; --orange: #f59e0b; --orange-dim: #f59e0b15;
  --purple: #8b5cf6; --purple-dim: #8b5cf615;
  --gradient-accent: linear-gradient(135deg, #3b82f6, #8b5cf6);
  --gradient-green: linear-gradient(135deg, #22c55e, #10b981);
  --gradient-warm: linear-gradient(135deg, #f59e0b, #ef4444);
  --shadow: rgba(0,0,0,0.06); --shadow-lg: rgba(0,0,0,0.12);
  --modal-bg: rgba(15,23,42,0.4);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg-primary); color: var(--text-primary);
  min-height: 100vh; padding: 24px 28px;
  transition: background 0.4s ease, color 0.4s ease;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Animations */
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideUp { from{transform:translateY(12px);opacity:0} to{transform:translateY(0);opacity:1} }
@keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }
@keyframes scaleIn { from{transform:scale(0.95);opacity:0} to{transform:scale(1);opacity:1} }
@keyframes bounceCheck { 0%{transform:scale(1)} 30%{transform:scale(1.3)} 60%{transform:scale(0.9)} 100%{transform:scale(1)} }
@keyframes strikeThrough { from{width:0} to{width:100%} }
@keyframes confetti { 0%{transform:translateY(0) rotate(0deg);opacity:1} 100%{transform:translateY(-60px) rotate(360deg);opacity:0} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
@keyframes glow { 0%,100%{box-shadow:0 0 8px var(--accent-glow)} 50%{box-shadow:0 0 16px var(--accent-glow)} }
@keyframes spinIn { from{transform:rotate(-90deg);opacity:0} to{transform:rotate(0deg);opacity:1} }
@keyframes todoEnter { from{transform:translateX(-8px);opacity:0} to{transform:translateX(0);opacity:1} }

/* Spring-like cubic bezier */
:root { --spring: cubic-bezier(0.34, 1.56, 0.64, 1); --smooth: cubic-bezier(0.4, 0, 0.2, 1); }

/* Header */
.header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
.header-left { display:flex; align-items:center; gap:12px; }
.header h1 {
  font-size:1.4rem; font-weight:800; letter-spacing:-0.5px;
  background: var(--gradient-accent); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}

.sync-badge {
  font-size:0.63rem; padding:4px 10px; border-radius:12px;
  background:var(--green-dim); color:var(--green);
  display:flex; align-items:center; gap:5px; font-weight:600;
  backdrop-filter:blur(8px); border:1px solid var(--green-dim);
  transition: all 0.3s var(--smooth);
}
.sync-badge::before { content:''; width:6px; height:6px; background:currentColor; border-radius:50%; animation:pulse 2s infinite; }

.header-right { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.nav { display:flex; align-items:center; gap:4px; }

.btn, .icon-btn {
  background:var(--bg-glass); border:1px solid var(--border); color:var(--text-primary);
  padding:7px 13px; border-radius:10px; cursor:pointer; font-size:0.8rem;
  transition:all 0.2s var(--spring); font-weight:500; min-height:34px;
  backdrop-filter:blur(12px); position:relative; overflow:hidden;
}
.btn:hover, .icon-btn:hover {
  background:var(--bg-tertiary); border-color:var(--border-hover);
  transform:translateY(-1px); box-shadow:0 4px 12px var(--shadow);
}
.btn:active, .icon-btn:active { transform:translateY(0) scale(0.97); }
.icon-btn { padding:7px 10px; font-size:1rem; line-height:1; min-width:34px; text-align:center; }
.nav .month-label { font-size:1rem; font-weight:600; min-width:140px; text-align:center; }

.btn-today {
  background:var(--gradient-accent)!important; border:none!important; color:#fff!important;
  box-shadow:0 2px 12px var(--accent-glow);
}
.btn-today:hover { box-shadow:0 4px 20px var(--accent-glow); transform:translateY(-2px); }
.btn-active { background:var(--accent-dim)!important; border-color:var(--accent)!important; color:var(--accent)!important; }

#themeBtn { transition: all 0.3s var(--spring); }
#themeBtn:active { transform: rotate(180deg) scale(0.9); }

/* Toolbar */
.toolbar {
  display:flex; align-items:center; gap:14px; margin-bottom:18px;
  padding:12px 18px; background:var(--bg-glass); border:1px solid var(--border);
  border-radius:14px; flex-wrap:wrap; backdrop-filter:blur(16px);
  box-shadow:0 2px 12px var(--shadow);
}
.stat-item { display:flex; align-items:center; gap:5px; font-size:0.75rem; color:var(--text-secondary); }
.stat-num { font-size:1rem; font-weight:800; transition:all 0.3s var(--spring); }
.stat-item.pending .stat-num { color:var(--orange); }
.stat-item.done .stat-num { color:var(--green); }
.stat-item.total .stat-num { color:var(--accent); }
.stat-item.streak .stat-num { color:var(--purple); }

.toolbar-right { margin-left:auto; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.auth-section { display:flex; align-items:center; gap:8px; }
.auth-btn {
  display:flex; align-items:center; gap:6px; padding:7px 14px; border-radius:10px;
  border:1px solid var(--border); background:var(--bg-glass); color:var(--text-primary);
  font-size:0.75rem; font-weight:500; cursor:pointer; transition:all 0.2s var(--spring);
  backdrop-filter:blur(8px);
}
.auth-btn:hover { background:var(--bg-tertiary); transform:translateY(-1px); box-shadow:0 3px 10px var(--shadow); }
.auth-btn img { width:14px; height:14px; }
.user-info { display:flex; align-items:center; gap:6px; font-size:0.75rem; color:var(--text-secondary); }
.user-avatar { width:26px; height:26px; border-radius:50%; border:2px solid var(--accent-dim); box-shadow:0 0 8px var(--accent-glow); }
.sign-out-btn { padding:4px 9px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--text-muted); font-size:0.65rem; cursor:pointer; transition:all 0.2s; }
.sign-out-btn:hover { color:var(--red); border-color:var(--red); background:var(--red-dim); }
.export-btn { font-size:0.72rem; padding:6px 11px; }

/* Weekdays */
.weekdays { display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px; }
.weekdays span { text-align:center; font-size:0.67rem; font-weight:600; color:var(--text-muted); padding:8px 0; text-transform:uppercase; letter-spacing:0.8px; }

/* Calendar Grid */
.calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }

.day-cell {
  min-height:88px; background:var(--bg-secondary); border:1px solid var(--border);
  border-radius:10px; padding:8px 9px; cursor:pointer;
  transition:all 0.25s var(--spring); position:relative; overflow:visible;
}
.day-cell:hover {
  background:var(--bg-tertiary); border-color:var(--accent-dim);
  transform:translateY(-3px) scale(1.02); box-shadow:0 6px 20px var(--shadow);
}
.day-cell:active { transform:translateY(-1px) scale(0.99); }
.day-cell.today { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent-dim), 0 2px 12px var(--accent-glow); animation:glow 3s ease infinite; }
.day-cell.other-month { opacity:0.15; pointer-events:none; }
.day-cell.selected { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-glow), 0 4px 16px var(--shadow); }
.day-cell.has-all-done { border-color:var(--green); box-shadow:0 0 0 1px var(--green-dim), 0 2px 10px var(--green-glow); }
.day-cell.overdue { border-color:var(--orange); background:var(--orange-dim); }

.day-number { font-size:0.76rem; font-weight:700; color:var(--text-muted); margin-bottom:4px; display:flex; justify-content:space-between; align-items:center; }
.day-cell.today .day-number { color:var(--accent); }
.day-cell.overdue .day-number { color:var(--orange); }

.day-badge {
  font-size:0.55rem; padding:2px 6px; border-radius:8px;
  background:var(--accent-dim); color:var(--accent); font-weight:700;
  backdrop-filter:blur(4px);
}
.day-cell.has-all-done .day-badge { background:var(--green-dim); color:var(--green); }
.day-cell.overdue .day-badge { background:var(--orange-dim); color:var(--orange); }

.day-todos-preview { display:flex; flex-direction:column; gap:2px; overflow:hidden; }
.todo-preview-item { display:flex; align-items:center; gap:4px; font-size:0.6rem; color:var(--text-secondary); line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.todo-preview-item.done { text-decoration:line-through; opacity:0.35; }
.todo-preview-dot { width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0; transition:all 0.2s; }
.todo-preview-item.done .todo-preview-dot { background:var(--green); }
.todo-preview-item.priority-high .todo-preview-dot { background:var(--red); box-shadow:0 0 4px var(--red-dim); }
.todo-preview-item.priority-medium .todo-preview-dot { background:var(--orange); }
.todo-overflow { font-size:0.55rem; color:var(--text-muted); padding-left:9px; }
.recurring-badge { font-size:0.55rem; color:var(--purple); margin-left:3px; }

/* Quick-add */
.quick-add-input {
  width:calc(100% + 2px); margin:4px -1px 0; background:var(--bg-primary); border:1px solid var(--accent);
  color:var(--text-primary); padding:5px 8px; border-radius:6px; font-size:0.67rem;
  outline:none; position:relative; z-index:2; box-shadow:0 0 12px var(--accent-glow);
  animation:scaleIn 0.15s var(--spring);
}

/* Week View */
.week-view { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.week-day-col {
  background:var(--bg-secondary); border:1px solid var(--border); border-radius:12px;
  padding:12px; min-height:200px; max-height:70vh; display:flex; flex-direction:column;
  transition:all 0.2s var(--smooth);
}
.week-day-col:hover { border-color:var(--border-hover); box-shadow:0 4px 16px var(--shadow); }
.week-day-header { text-align:center; padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid var(--border); cursor:pointer; transition:all 0.2s; }
.week-day-header:hover { transform:scale(1.05); }
.week-day-header .day-name { font-size:0.68rem; color:var(--text-muted); text-transform:uppercase; font-weight:600; }
.week-day-header .day-num { font-size:1.3rem; font-weight:800; color:var(--text-primary); margin-top:2px; }
.week-day-header.today .day-num { color:var(--accent); text-shadow:0 0 12px var(--accent-glow); }
.week-day-header.overdue .day-num { color:var(--orange); }

.week-todo-list { flex:1; display:flex; flex-direction:column; gap:3px; overflow-y:auto; margin-bottom:8px; }
.week-todo-item {
  display:flex; align-items:center; gap:6px; padding:6px 8px;
  background:var(--bg-primary); border-radius:7px; border:1px solid var(--border); font-size:0.7rem;
  cursor:pointer; transition:all 0.2s var(--spring); min-height:30px;
}
.week-todo-item:hover { border-color:var(--border-hover); transform:translateX(2px); }
.week-todo-item input[type="checkbox"] {
  appearance:none; width:15px; height:15px; border:2px solid var(--border);
  border-radius:4px; cursor:pointer; flex-shrink:0; position:relative; transition:all 0.25s var(--spring);
}
.week-todo-item input[type="checkbox"]:checked { background:var(--gradient-green); border-color:transparent; animation:bounceCheck 0.35s var(--spring); }
.week-todo-item input[type="checkbox"]:checked::after {
  content:''; position:absolute; left:3px; top:1px; width:4px; height:7px;
  border:solid #fff; border-width:0 1.5px 1.5px 0; transform:rotate(45deg);
}
.week-todo-item.done .week-todo-text { text-decoration:line-through; color:var(--text-muted); }
.week-todo-text { flex:1; color:var(--text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; word-break:break-all; }
.week-todo-item .priority-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.week-add-input {
  width:100%; background:var(--bg-primary); border:1px solid var(--border);
  color:var(--text-primary); padding:7px 10px; border-radius:8px; font-size:0.7rem;
  outline:none; transition:all 0.2s var(--smooth); flex-shrink:0;
}
.week-add-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
.week-add-input::placeholder { color:var(--text-muted); }

/* Side Panel */
.panel-overlay { position:fixed; inset:0; background:var(--modal-bg); backdrop-filter:blur(8px); display:none; z-index:100; }
.panel-overlay.open { display:block; animation:fadeIn 0.25s var(--smooth); }

.panel {
  position:fixed; top:0; right:0; width:440px; max-width:92vw; height:100vh;
  background:var(--bg-primary); border-left:1px solid var(--border);
  display:flex; flex-direction:column;
  box-shadow:-10px 0 40px var(--shadow-lg);
  animation:slideIn 0.3s var(--spring); z-index:101;
}

.panel-header { padding:26px 26px 18px; border-bottom:1px solid var(--border); }
.panel-header-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
.panel-header h2 { font-size:1.3rem; font-weight:800; }
.panel-header-sub { font-size:0.75rem; color:var(--text-muted); margin-top:3px; }
.panel-close {
  background:var(--bg-secondary); border:1px solid var(--border); color:var(--text-secondary);
  width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  border-radius:8px; cursor:pointer; font-size:0.95rem; transition:all 0.2s var(--spring);
}
.panel-close:hover { background:var(--bg-tertiary); color:var(--text-primary); transform:rotate(90deg); }

/* Progress */
.panel-progress {
  padding:12px 16px; background:var(--bg-glass); border-radius:10px; display:flex; align-items:center; gap:14px;
  backdrop-filter:blur(8px); border:1px solid var(--border);
}
.progress-ring { width:44px; height:44px; flex-shrink:0; }
.progress-ring circle { fill:none; stroke-width:4; }
.progress-ring .bg { stroke:var(--border); }
.progress-ring .fill { stroke-linecap:round; transition:stroke-dashoffset 0.6s var(--smooth); }
.progress-text { display:flex; flex-direction:column; gap:2px; }
.progress-text .pct { font-size:1.1rem; font-weight:800; transition:color 0.3s; }
.progress-text .label { font-size:0.68rem; color:var(--text-muted); }

.panel-body { flex:1; overflow-y:auto; padding:22px 26px; }

/* Add form */
.add-todo-form { margin-bottom:22px; }
.add-todo-input-row { display:flex; gap:8px; margin-bottom:10px; }
.add-todo-input-row input {
  flex:1; background:var(--bg-secondary); border:1px solid var(--border); color:var(--text-primary);
  padding:12px 16px; border-radius:10px; font-size:0.87rem; outline:none;
  transition:all 0.2s var(--smooth);
}
.add-todo-input-row input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim), 0 4px 12px var(--accent-glow); }
.add-todo-input-row input::placeholder { color:var(--text-muted); }
.add-todo-input-row button {
  background:var(--gradient-green); border:none; color:#fff; padding:12px 20px;
  border-radius:10px; cursor:pointer; font-size:0.84rem; font-weight:700;
  transition:all 0.2s var(--spring); box-shadow:0 2px 10px var(--green-glow);
}
.add-todo-input-row button:hover { transform:translateY(-2px); box-shadow:0 4px 18px var(--green-glow); }
.add-todo-input-row button:active { transform:translateY(0) scale(0.96); }

.add-options { display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
.add-options span { font-size:0.68rem; color:var(--text-muted); }
.priority-btn, .repeat-btn {
  padding:5px 11px; border-radius:14px; border:1px solid var(--border); background:var(--bg-secondary);
  color:var(--text-secondary); font-size:0.65rem; cursor:pointer;
  transition:all 0.2s var(--spring); font-weight:600;
}
.priority-btn:hover, .repeat-btn:hover { transform:translateY(-1px); }
.priority-btn.active { border-color:transparent; transform:scale(1.05); }
.priority-btn.low.active { background:var(--accent-dim); color:var(--accent); box-shadow:0 2px 8px var(--accent-glow); }
.priority-btn.medium.active { background:var(--orange-dim); color:var(--orange); box-shadow:0 2px 8px var(--orange-dim); }
.priority-btn.high.active { background:var(--red-dim); color:var(--red); box-shadow:0 2px 8px var(--red-dim); }
.repeat-btn.active { background:var(--purple-dim); color:var(--purple); border-color:transparent; box-shadow:0 2px 8px var(--purple-dim); }
.options-divider { width:1px; height:16px; background:var(--border); margin:0 4px; }

/* Todo list */
.todo-section-label { font-size:0.65rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:9px; padding-left:2px; }
.todo-list { display:flex; flex-direction:column; gap:6px; margin-bottom:18px; }

.todo-item {
  display:flex; align-items:flex-start; gap:11px; padding:13px 15px;
  background:var(--bg-secondary); border-radius:10px; border:1px solid var(--border);
  transition:all 0.2s var(--spring); cursor:grab; user-select:none;
  animation:todoEnter 0.25s var(--spring) backwards;
}
.todo-item:nth-child(1){animation-delay:0s} .todo-item:nth-child(2){animation-delay:0.03s}
.todo-item:nth-child(3){animation-delay:0.06s} .todo-item:nth-child(4){animation-delay:0.09s}
.todo-item:nth-child(5){animation-delay:0.12s}

.todo-item:hover { border-color:var(--border-hover); box-shadow:0 3px 12px var(--shadow); transform:translateX(3px); }
.todo-item.dragging { opacity:0.3; transform:rotate(2deg); }
.todo-item.drag-over { border-color:var(--accent); border-style:dashed; background:var(--accent-dim); }

.todo-item input[type="checkbox"] {
  appearance:none; width:22px; height:22px; border:2.5px solid var(--border); border-radius:7px;
  cursor:pointer; flex-shrink:0; margin-top:1px; transition:all 0.25s var(--spring); position:relative;
}
.todo-item input[type="checkbox"]:hover { border-color:var(--green); transform:scale(1.1); box-shadow:0 0 8px var(--green-glow); }
.todo-item input[type="checkbox"]:checked {
  background:var(--gradient-green); border-color:transparent;
  animation:bounceCheck 0.4s var(--spring);
  box-shadow:0 0 10px var(--green-glow);
}
.todo-item input[type="checkbox"]:checked::after {
  content:''; position:absolute; left:5px; top:3px; width:6px; height:9px;
  border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(45deg);
}
.todo-item-content { flex:1; display:flex; flex-direction:column; gap:4px; min-width:0; }
.todo-item .todo-text {
  font-size:0.9rem; font-weight:500; color:var(--text-primary); line-height:1.4;

}
.todo-item.done .todo-text { text-decoration:line-through; color:var(--text-muted); font-weight:400; }
.todo-item .todo-meta { display:flex; align-items:center; gap:6px; font-size:0.65rem; color:var(--text-muted); flex-wrap:wrap; }
.priority-tag { font-size:0.57rem; padding:2px 7px; border-radius:6px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px; }
.priority-tag.high { background:var(--red-dim); color:var(--red); }
.priority-tag.medium { background:var(--orange-dim); color:var(--orange); }

.todo-item .delete-btn {
  background:none; border:none; color:var(--text-muted); cursor:pointer;
  font-size:0.88rem; padding:4px 7px; border-radius:6px; transition:all 0.2s var(--spring); flex-shrink:0; margin-top:2px;
}
.todo-item .delete-btn:hover { color:var(--red); background:var(--red-dim); transform:scale(1.15); }
@media(hover:hover){.todo-item .delete-btn{opacity:0} .todo-item:hover .delete-btn{opacity:1}}

.empty-state { text-align:center; color:var(--text-muted); padding:40px 0; font-size:0.85rem; }
.empty-state-icon { font-size:2.2rem; margin-bottom:10px; opacity:0.25; }

/* Panel footer */
.panel-footer { padding:13px 26px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.keyboard-hint { font-size:0.63rem; color:var(--text-muted); }
kbd { background:var(--bg-card); border:1px solid var(--border); padding:2px 5px; border-radius:4px; font-size:0.6rem; font-family:inherit; }
.panel-nav { display:flex; gap:4px; }
.panel-nav button {
  background:var(--bg-secondary); border:1px solid var(--border); color:var(--text-secondary);
  padding:6px 12px; border-radius:7px; cursor:pointer; font-size:0.75rem;
  transition:all 0.2s var(--spring); min-height:30px;
}
.panel-nav button:hover { background:var(--bg-tertiary); color:var(--text-primary); transform:translateY(-1px); }

/* Confetti canvas */
#confetti { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; }

/* Responsive */
@media(max-width:900px){
  body{padding:12px} .day-cell{min-height:58px;padding:5px} .todo-preview-item{display:none}
  .toolbar{gap:8px} .panel{width:100%;max-width:100%}
  .week-view{grid-template-columns:repeat(2,1fr)} .week-day-col{min-height:150px;max-height:50vh}

}

  .header{flex-direction:column;align-items:stretch} .header-right{justify-content:center}

}

/* Notes on todos */
.todo-notes {
  margin-top:8px; padding:10px 12px; background:var(--bg-primary); border:1px solid var(--border);

}

}

.todo-notes-hint { font-size:0.6rem; color:var(--text-muted); margin-top:4px; }

/* Focus Mode */
.focus-overlay {
  position:fixed; inset:0; background:var(--bg-primary); z-index:200;

  animation:fadeIn 0.3s var(--smooth); overflow-y:auto;
}
.focus-overlay.open { display:flex; }
.focus-header {
  width:100%; max-width:560px; display:flex; justify-content:space-between; align-items:center; margin-bottom:32px;
}
.focus-header h2 { font-size:1.6rem; font-weight:800; background:var(--gradient-accent); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.focus-close { background:var(--bg-secondary); border:1px solid var(--border); color:var(--text-secondary); padding:8px 16px; border-radius:8px; cursor:pointer; font-size:0.8rem; transition:all 0.2s var(--spring); }
.focus-close:hover { background:var(--bg-tertiary); color:var(--text-primary); }
.focus-content { width:100%; max-width:560px; }
.focus-progress { margin-bottom:28px; text-align:center; }
.focus-progress .big-pct { font-size:2.5rem; font-weight:800; }

.focus-todo-item input[type="checkbox"]:checked::after { content:''; position:absolute; left:7px; top:4px; width:7px; height:11px; border:solid #fff; border-width:0 3px 3px 0; transform:rotate(45deg); }
.focus-todo-item .focus-text { font-size:1.05rem; font-weight:500; color:var(--text-primary); flex:1; }
.focus-todo-item.done .focus-text { text-decoration:line-through; color:var(--text-muted); }

/* Swipe delete hint */

/* Undo Toast */
.undo-toast {
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(80px);

}
.undo-toast button:hover { transform:scale(1.05); }
.undo-toast .undo-timer { width:40px; height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
.undo-toast .undo-timer-fill { height:100%; background:var(--accent); transition:width linear; }

/* Search */
.search-overlay {
  position:fixed; inset:0; background:var(--modal-bg); backdrop-filter:blur(8px);
  display:none; z-index:250; align-items:flex-start; justify-content:center; padding-top:12vh;
}

}
.search-input-row { display:flex; align-items:center; padding:16px 20px; gap:10px; border-bottom:1px solid var(--border); }

}
.search-input-row input::placeholder { color:var(--text-muted); }
.search-input-row .search-icon { color:var(--text-muted); font-size:1.1rem; }
.search-results { max-height:50vh; overflow-y:auto; padding:8px; }
.search-result-item {
  display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:8px;

}
.search-result-item:hover { background:var(--bg-tertiary); }
.search-result-item .sr-text { flex:1; font-size:0.85rem; color:var(--text-primary); }
.search-result-item .sr-text mark { background:var(--accent-dim); color:var(--accent); border-radius:2px; padding:0 2px; }
.search-result-item .sr-date { font-size:0.7rem; color:var(--text-muted); white-space:nowrap; }
.search-result-item .sr-done { text-decoration:line-through; color:var(--text-muted); }
.search-empty { text-align:center; padding:32px; color:var(--text-muted); font-size:0.85rem; }

/* Inbox */
.inbox-badge { background:var(--purple-dim); color:var(--purple); font-size:0.6rem; padding:2px 6px; border-radius:8px; font-weight:700; margin-left:4px; }

/* Carry-forward banner */
.carry-forward-banner {
  display:flex; align-items:center; gap:12px; padding:10px 16px; margin-bottom:12px;
  background:var(--orange-dim); border:1px solid var(--orange); border-radius:10px;
  font-size:0.78rem; color:var(--orange); animation:slideUp 0.3s var(--spring);
}
.carry-forward-banner button {
  background:var(--orange); border:none; color:#fff; padding:5px 12px; border-radius:6px;
  cursor:pointer; font-size:0.72rem; font-weight:600; margin-left:auto; transition:all 0.15s var(--spring);
}
.carry-forward-banner button:hover { transform:scale(1.05); }

/* Keyboard shortcut overlay */
.shortcuts-hint {
  position:fixed; bottom:28px; right:28px; background:var(--bg-glass); border:1px solid var(--border);
  padding:6px 12px; border-radius:8px; font-size:0.65rem; color:var(--text-muted);
  backdrop-filter:blur(8px); z-index:50; transition:opacity 0.3s;
}
.shortcuts-hint kbd { margin:0 2px; }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="header">

<div class="toolbar">
  <div class="stat-item total"><span class="stat-num" id="statTotal">0</span> this month</div>
  <div class="stat-item pending"><span class="stat-num" id="statPending">0</span> pending</div>

    <div class="auth-section" id="authSection">

<!-- Search Overlay -->

  <div class="search-box">

<script>
// --- Confetti ---
const confettiCanvas=document.getElementById('confetti');
const ctx=confettiCanvas.getContext('2d');
let confettiPieces=[];
function resizeConfetti(){confettiCanvas.width=window.innerWidth;confettiCanvas.height=window.innerHeight;}
resizeConfetti();window.addEventListener('resize',resizeConfetti);

function launchConfetti(){
  const colors=['#6ea8fe','#5cdb7f','#b88cff','#ffb347','#ff6b6b','#47d4a0'];
  for(let i=0;i<50;i++){
    confettiPieces.push({
      x:confettiCanvas.width/2+(Math.random()-0.5)*200,
      y:confettiCanvas.height/2,
      vx:(Math.random()-0.5)*12,
      vy:-(Math.random()*14+6),
      size:Math.random()*6+3,
      color:colors[Math.floor(Math.random()*colors.length)],
      rotation:Math.random()*360,
      rotSpeed:(Math.random()-0.5)*10,
      life:1
    });
  }
  if(confettiPieces.length===50)animateConfetti();
}

function animateConfetti(){
  ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  confettiPieces=confettiPieces.filter(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.4; p.rotation+=p.rotSpeed; p.life-=0.015;
    if(p.life<=0)return false;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation*Math.PI/180);
    ctx.fillStyle=p.color;ctx.globalAlpha=p.life;
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    ctx.restore();return true;
  });
  if(confettiPieces.length>0)requestAnimationFrame(animateConfetti);
}

// --- Firebase ---
firebase.initializeApp({apiKey:"AIzaSyAMWjbYB6-uWEDHLIXc4wDUmT23vxor2kk",authDomain:"todo-calendar-dde90.firebaseapp.com",projectId:"todo-calendar-dde90",storageBucket:"todo-calendar-dde90.firebasestorage.app",messagingSenderId:"791175432633",appId:"1:791175432633:web:8a95bfd236fe74f2b10e68"});
const auth=firebase.auth(),db=firebase.firestore();let currentUser=null;

// --- Theme ---
function toggleTheme(){const h=document.documentElement,n=h.dataset.theme==='dark'?'light':'dark';h.dataset.theme=n;localStorage.setItem('todo-cal-theme',n);document.getElementById('themeBtn').innerHTML=n==='dark'?'&#9790;':'&#9728;';}
(function(){const s=localStorage.getItem('todo-cal-theme');if(s){document.documentElement.dataset.theme=s;document.getElementById('themeBtn').innerHTML=s==='dark'?'&#9790;':'&#9728;';}})();

// --- Auth ---
function signInWithGoogle(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>alert('Sign-in failed: '+e.message));}
function signOut(){auth.signOut();}
auth.onAuthStateChanged(user=>{currentUser=user;const s=document.getElementById('authSection');
  if(user){s.innerHTML=`<div class="user-info"><img class="user-avatar" src="${user.photoURL||''}" alt=""><span>${user.displayName||user.email}</span></div><button class="sign-out-btn" onclick="signOut()">Sign out</button>`;showSyncStatus('Synced');loadTodos();}
  else{s.innerHTML=`<button class="auth-btn" onclick="signInWithGoogle()"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt=""> Sign in</button>`;showSyncStatus('Local');loadTodos();}
});

// --- State ---
let currentDate=new Date(),selectedDate=null,currentPriority='low',currentRepeat='none';
let todos={},recurring=[],saveTimeout=null,currentView='month';
let todosForDayCache={},cacheVersion=0;

// --- Persistence ---
async function loadTodos(){
  if(currentUser){try{const doc=await db.collection('users').doc(currentUser.uid).get();if(doc.exists){const d=doc.data();todos=d.todos||{};recurring=d.recurring||[];}else{todos=JSON.parse(localStorage.getItem('todo-calendar-data')||'{}');recurring=JSON.parse(localStorage.getItem('todo-calendar-recurring')||'[]');if(Object.keys(todos).length>0||recurring.length>0)await db.collection('users').doc(currentUser.uid).set({todos,recurring});}showSyncStatus('Synced');}catch(e){todos=JSON.parse(localStorage.getItem('todo-calendar-data')||'{}');recurring=JSON.parse(localStorage.getItem('todo-calendar-recurring')||'[]');showSyncStatus('Offline');}}
  else{todos=JSON.parse(localStorage.getItem('todo-calendar-data')||'{}');recurring=JSON.parse(localStorage.getItem('todo-calendar-recurring')||'[]');}
  invalidateCache();render();
}
function saveTodos(){clearTimeout(saveTimeout);invalidateCache();saveTimeout=setTimeout(async()=>{localStorage.setItem('todo-calendar-data',JSON.stringify(todos));localStorage.setItem('todo-calendar-recurring',JSON.stringify(recurring));if(currentUser){try{await db.collection('users').doc(currentUser.uid).set({todos,recurring});showSyncStatus('Synced');}catch(e){showSyncStatus('Offline');}}},500);}
function showSyncStatus(t){const b=document.getElementById('syncBadge');b.textContent=t;if(t==='Synced'){b.style.color='var(--green)';b.style.background='var(--green-dim)';}else if(t==='Local'){b.style.color='var(--accent)';b.style.background='var(--accent-dim)';}else{b.style.color='var(--orange)';b.style.background='var(--orange-dim)';}}

// --- Export/Import ---
function exportData(){const data=JSON.stringify({todos,recurring},null,2);const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`todo-calendar-backup-${dateKey(new Date())}.json`;a.click();URL.revokeObjectURL(a.href);}
function importData(e){const file=e.target.files[0];if(!file)return;if(!confirm('This will replace all current data. Continue?'))return;const reader=new FileReader();reader.onload=ev=>{try{const d=JSON.parse(ev.target.result);todos=d.todos||{};recurring=d.recurring||[];saveTodos();render();alert('Import successful!');}catch(err){alert('Invalid file');}};reader.readAsText(file);e.target.value='';}

// --- Cache ---
function invalidateCache(){cacheVersion++;todosForDayCache={};}
function getTodosForDay(key){const ck=key+'_'+cacheVersion;if(todosForDayCache[ck])return todosForDayCache[ck];
  const base=(todos[key]||[]).filter(t=>!t.recurringId);const d=new Date(key+'T12:00:00');const dow=d.getDay();
  const recTodos=recurring.filter(r=>{const start=new Date(r.startDate+'T12:00:00');if(d<start)return false;if(r.repeat==='daily')return true;if(r.repeat==='weekdays')return dow>=1&&dow<=5;if(r.repeat==='weekly')return dow===start.getDay();return false;}).map(r=>{const dm=(todos[key]||[]).find(t=>t.recurringId===r.id);return{...r,isRecurring:true,done:!!(dm&&dm.done)};});
  const result=[...base,...recTodos];todosForDayCache[ck]=result;return result;}
function isOverdue(key){const today=new Date();today.setHours(0,0,0,0);const d=new Date(key+'T12:00:00');if(d>=today)return false;const dt=getTodosForDay(key);return dt.length>0&&dt.some(t=>!t.done);}

// --- Helpers ---
function dateKey(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getRelativeDay(key){const today=new Date();today.setHours(0,0,0,0);const d=new Date(key+'T12:00:00');const diff=Math.round((d-today)/86400000);if(diff===0)return'Today';if(diff===1)return'Tomorrow';if(diff===-1)return'Yesterday';return'';}

// --- Stats ---
function updateStats(){const year=currentDate.getFullYear(),month=currentDate.getMonth();let total=0,done=0;const dim=new Date(year,month+1,0).getDate();for(let i=1;i<=dim;i++){const key=dateKey(new Date(year,month,i));const dt=getTodosForDay(key);total+=dt.length;done+=dt.filter(t=>t.done).length;}document.getElementById('statTotal').textContent=total;document.getElementById('statPending').textContent=total-done;document.getElementById('statDone').textContent=done;document.getElementById('statStreak').textContent=calculateStreak();}
function calculateStreak(){let streak=0;const today=new Date();today.setHours(0,0,0,0);let d=new Date(today);let empty=0;for(let i=0;i<60;i++){const key=dateKey(d);const items=getTodosForDay(key);if(items.length>0&&items.every(t=>t.done)){streak++;empty=0;}else if(items.length>0)break;else{empty++;if(empty>7)break;}d.setDate(d.getDate()-1);}return streak;}

// --- Views ---
function setView(v){currentView=v;document.getElementById('monthView').style.display=v==='month'?'block':'none';document.getElementById('weekView').style.display=v==='week'?'block':'none';document.getElementById('viewMonthBtn').classList.toggle('btn-active',v==='month');document.getElementById('viewWeekBtn').classList.toggle('btn-active',v==='week');render();}
function render(){if(currentView==='month')renderCalendar();else renderWeekView();updateStats();}

// --- Month ---
function renderCalendar(){const grid=document.getElementById('calendarGrid');const year=currentDate.getFullYear(),month=currentDate.getMonth();document.getElementById('monthLabel').textContent=new Date(year,month).toLocaleDateString('en-US',{month:'long',year:'numeric'});const fd=new Date(year,month,1).getDay(),dim=new Date(year,month+1,0).getDate(),dip=new Date(year,month,0).getDate();const today=new Date();let html='';for(let i=fd-1;i>=0;i--)html+=buildDayCell(new Date(year,month-1,dip-i),dip-i,true,today);for(let i=1;i<=dim;i++)html+=buildDayCell(new Date(year,month,i),i,false,today);const total=Math.ceil((fd+dim)/7)*7;for(let i=1;i<=total-(fd+dim);i++)html+=buildDayCell(new Date(year,month+1,i),i,true,today);grid.innerHTML=html;}

let clickTimer=null;
function handleDayClick(key){if(clickTimer){clearTimeout(clickTimer);clickTimer=null;return;}clickTimer=setTimeout(()=>{clickTimer=null;openDay(key);},220);}
function handleDayDblClick(e,key){if(clickTimer){clearTimeout(clickTimer);clickTimer=null;}quickAdd(e,key);}

function buildDayCell(date,dayNum,otherMonth,today){const key=dateKey(date),dt=getTodosForDay(key);const isToday=date.toDateString()===today.toDateString();const isSel=selectedDate&&date.toDateString()===selectedDate.toDateString();const has=dt.length>0,allDone=has&&dt.every(t=>t.done),overdue=!otherMonth&&isOverdue(key);
  let cls='day-cell';if(otherMonth)cls+=' other-month';if(isToday)cls+=' today';if(isSel)cls+=' selected';if(has)cls+=' has-todos';if(allDone)cls+=' has-all-done';if(overdue)cls+=' overdue';
  let badge='';if(has){const dc=dt.filter(t=>t.done).length;badge=`<span class="day-badge">${dc}/${dt.length}</span>`;}
  let preview='';dt.slice(0,3).forEach(t=>{const d=t.done?' done':'',p=t.priority!=='low'?` priority-${t.priority}`:'';const txt=t.text.length>14?t.text.slice(0,14)+'\u2026':t.text;const rec=t.isRecurring?'<span class="recurring-badge">&#8635;</span>':'';preview+=`<div class="todo-preview-item${d}${p}"><span class="todo-preview-dot"></span>${escapeHtml(txt)}${rec}</div>`;});
  if(dt.length>3)preview+=`<div class="todo-overflow">+${dt.length-3} more</div>`;
  return`<div class="${cls}" onclick="handleDayClick('${key}')" ondblclick="handleDayDblClick(event,'${key}')" ondragover="handleCalendarDragOver(event)" ondragenter="handleCalendarDragEnter(event)" ondragleave="handleCalendarDragLeave(event)" ondrop="handleCalendarDrop(event,'${key}')"><div class="day-number">${dayNum}${badge}</div><div class="day-todos-preview">${preview}</div></div>`;}

function quickAdd(e,key){e.stopPropagation();const cell=e.currentTarget;if(cell.querySelector('.quick-add-input'))return;const input=document.createElement('input');input.className='quick-add-input';input.placeholder='Quick add...';input.maxLength=500;input.onkeydown=ev=>{if(ev.key==='Enter'&&input.value.trim()){if(!todos[key])todos[key]=[];todos[key].push({text:input.value.trim(),done:false,priority:'low',created:new Date().toISOString()});saveTodos();render();}if(ev.key==='Escape'||ev.key==='Enter'){ev.stopPropagation();input.remove();}};input.onblur=()=>setTimeout(()=>input.remove(),100);cell.appendChild(input);input.focus();}

// --- Week ---
function renderWeekView(){const grid=document.getElementById('weekGrid');const today=new Date();today.setHours(0,0,0,0);const sow=new Date(currentDate);sow.setDate(sow.getDate()-sow.getDay());document.getElementById('monthLabel').textContent=sow.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' \u2013 '+new Date(sow.getTime()+6*86400000).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  let html='';for(let i=0;i<7;i++){const d=new Date(sow);d.setDate(d.getDate()+i);const key=dateKey(d);const dt=getTodosForDay(key);const isToday=d.toDateString()===today.toDateString();const overdue=isOverdue(key);const hc=isToday?' today':overdue?' overdue':'';
    html+=`<div class="week-day-col" ondragover="handleCalendarDragOver(event)" ondragenter="this.classList.add('drop-target')" ondragleave="this.classList.remove('drop-target')" ondrop="this.classList.remove('drop-target');handleCalendarDrop(event,'${key}')"><div class="week-day-header${hc}" onclick="openDay('${key}')"><div class="day-name">${d.toLocaleDateString('en-US',{weekday:'short'})}</div><div class="day-num">${d.getDate()}</div></div><div class="week-todo-list">`;
    dt.slice(0,15).forEach((t,idx)=>{const dc=t.done?' done':'';const pc=t.priority==='high'?'var(--red)':t.priority==='medium'?'var(--orange)':'var(--accent)';const isRec=!!t.isRecurring;const dragAttr=!isRec?` draggable="true" ondragstart="startCrossDayDrag(event,'${key}',${idx})"`:'';html+=`<div class="week-todo-item${dc}"${dragAttr}><input type="checkbox" ${t.done?'checked':''} onchange="toggleWeekTodo('${key}',${idx},${isRec},'${t.id||''}')" aria-label="${escapeHtml(t.text)}"><span class="week-todo-text">${escapeHtml(t.text)}</span><span class="priority-dot" style="background:${pc}"></span><button class="delete-btn" onclick="deleteWeekTodo('${key}',${idx},${isRec},'${t.id||''}')" style="opacity:0.5;font-size:0.7rem;padding:2px 5px;border:none;background:none;color:var(--text-muted);cursor:pointer" aria-label="Delete">&#10005;</button></div>`;});
    if(dt.length>15)html+=`<div style="font-size:0.6rem;color:var(--text-muted);text-align:center;padding:3px">+${dt.length-15} more</div>`;
    html+=`</div><input class="week-add-input" placeholder="+ Add" onkeydown="weekQuickAdd(event,'${key}')" aria-label="Add todo"></div>`;}
  grid.innerHTML=html;}
function weekQuickAdd(e,key){if(e.key!=='Enter'||!e.target.value.trim())return;if(!todos[key])todos[key]=[];todos[key].push({text:e.target.value.trim(),done:false,priority:'low',created:new Date().toISOString()});e.target.value='';saveTodos();render();}
function toggleWeekTodo(key,index,isRec,rid){if(isRec){if(!todos[key])todos[key]=[];const ex=todos[key].find(t=>t.recurringId===rid);if(ex)ex.done=!ex.done;else todos[key].push({recurringId:rid,done:true,text:'',priority:'low'});}else{const base=(todos[key]||[]).filter(t=>!t.recurringId);if(base[index])base[index].done=!base[index].done;}saveTodos();render();checkAllDone(key);}
function deleteWeekTodo(key,idx,isRec,rid){
  if(isRec){deleteRecurring(rid);return;}
  const nri=[];(todos[key]||[]).forEach((t,i)=>{if(!t.recurringId)nri.push(i);});
  const ai=nri[idx];if(ai===undefined)return;
  todos[key].splice(ai,1);if(todos[key].length===0)delete todos[key];
  saveTodos();render();
}

// --- Panel ---
function openDay(key){selectedDate=new Date(key+'T12:00:00');document.getElementById('panelOverlay').classList.add('open');document.getElementById('panel').style.display='flex';const d=selectedDate;document.getElementById('panelTitle').textContent=d.toLocaleDateString('en-US',{weekday:'long'});const sub=d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});const rel=getRelativeDay(key);document.getElementById('panelSub').textContent=rel?`${sub} \u2022 ${rel}`:sub;renderProgress(key);renderPanelTodoList(key);render();setTimeout(()=>document.getElementById('todoInput').focus(),150);}
function closePanel(){document.getElementById('panelOverlay').classList.remove('open');document.getElementById('panel').style.display='none';selectedDate=null;render();}
function navDay(delta){if(!selectedDate)return;selectedDate.setDate(selectedDate.getDate()+delta);openDay(dateKey(selectedDate));}

function renderProgress(key){const dt=getTodosForDay(key),section=document.getElementById('progressSection');if(dt.length===0){section.innerHTML='';return;}const done=dt.filter(t=>t.done).length,pct=Math.round((done/dt.length)*100);const circ=2*Math.PI*18,offset=circ-(pct/100)*circ;const color=pct===100?'var(--green)':pct>=50?'var(--accent)':pct>0?'var(--orange)':'var(--text-muted)';
  section.innerHTML=`<div class="panel-progress"><svg class="progress-ring" viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="18"/><circle class="fill" cx="22" cy="22" r="18" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" transform="rotate(-90 22 22)" style="stroke:${color}"/></svg><div class="progress-text"><span class="pct" style="color:${color}">${pct}%</span><span class="label">${done} of ${dt.length} done</span></div></div>`;}

function renderPanelTodoList(key){const dt=getTodosForDay(key),container=document.getElementById('todoListContainer');if(dt.length===0){container.innerHTML=`<div class="empty-state"><div class="empty-state-icon">&#9744;</div>No tasks yet. Add one above!</div>`;return;}
  const baseItems=(todos[key]||[]).filter(t=>!t.recurringId);const recItems=dt.filter(t=>t.isRecurring);
  const undone=[...baseItems.map((t,i)=>({...t,realIdx:i,isRec:false})).filter(t=>!t.done),...recItems.filter(t=>!t.done).map(t=>({...t,realIdx:-1,isRec:true}))];
  const doneArr=[...baseItems.map((t,i)=>({...t,realIdx:i,isRec:false})).filter(t=>t.done),...recItems.filter(t=>t.done).map(t=>({...t,realIdx:-1,isRec:true}))];
  const prioOrder={high:0,medium:1,low:2};undone.sort((a,b)=>(prioOrder[a.priority]||2)-(prioOrder[b.priority]||2));
  let html='';
  if(undone.length>0){html+=`<div class="todo-section-label">To do (${undone.length})</div><div class="todo-list" data-key="${key}" data-section="undone">`;html+=undone.map(t=>renderPanelTodoItem(key,t)).join('');html+='</div>';}
  if(doneArr.length>0){html+=`<div class="todo-section-label">Completed (${doneArr.length})</div><div class="todo-list">`;html+=doneArr.map(t=>renderPanelTodoItem(key,t)).join('');html+='</div>';}
  container.innerHTML=html;initDragDrop(key);}

function renderPanelTodoItem(key,todo){const prioTag=todo.priority!=='low'?`<span class="priority-tag ${todo.priority}">${todo.priority}</span>`:'';const timeStr=todo.created?new Date(todo.created).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';const recBadge=todo.isRec?`<span class="recurring-badge">&#8635; ${todo.repeat||''}</span>`:'';
  const noteInd=(!todo.isRec&&todo.notes)?'<span class="note-indicator">&#9998; note</span>':'';
  const noteClick=!todo.isRec?`onclick="toggleNotes('${key}',${todo.realIdx})"`:'';
  const delBtn=todo.isRec?`<button class="delete-btn" onclick="event.stopPropagation();deleteRecurring('${todo.id}')" aria-label="Delete">&#10005;</button>`:`<button class="delete-btn" onclick="event.stopPropagation();deleteTodo('${key}',${todo.realIdx})" aria-label="Delete">&#10005;</button>`;
  return`<div class="todo-item${todo.done?' done':''}" draggable="${!todo.isRec}" data-real-idx="${todo.realIdx}" data-key="${key}" ondragstart="startCrossDayDrag(event,'${key}',${todo.realIdx})"><input type="checkbox" ${todo.done?'checked':''} onchange="toggleTodo('${key}',${todo.realIdx},${todo.isRec},'${todo.id||''}')" aria-label="${escapeHtml(todo.text)}"><div class="todo-item-content" ${noteClick}><span class="todo-text">${escapeHtml(todo.text)}</span><div class="todo-meta">${prioTag}${recBadge}${noteInd}<span>${timeStr}</span></div></div>${delBtn}</div>`;}

// --- Drag & Drop ---
function initDragDrop(key){const lists=document.querySelectorAll('.todo-list[data-section="undone"]');lists.forEach(list=>{const items=list.querySelectorAll('.todo-item[draggable="true"]');items.forEach(item=>{
  item.addEventListener('dragstart',e=>{item.classList.add('dragging');e.dataTransfer.setData('text/plain',item.dataset.realIdx);e.dataTransfer.effectAllowed='move';});
  item.addEventListener('dragend',()=>item.classList.remove('dragging'));
  item.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';item.classList.add('drag-over');});
  item.addEventListener('dragleave',()=>item.classList.remove('drag-over'));
  item.addEventListener('drop',e=>{e.preventDefault();item.classList.remove('drag-over');const fromIdx=parseInt(e.dataTransfer.getData('text/plain'));const toIdx=parseInt(item.dataset.realIdx);if(isNaN(fromIdx)||isNaN(toIdx)||fromIdx<0||toIdx<0||fromIdx===toIdx)return;const allItems=todos[key]||[];const nri=[];allItems.forEach((t,i)=>{if(!t.recurringId)nri.push(i);});const rf=nri[fromIdx],rt=nri[toIdx];if(rf===undefined||rt===undefined)return;const el=allItems.splice(rf,1)[0];allItems.splice(rt>rf?rt-1:rt,0,el);todos[key]=allItems;saveTodos();renderPanelTodoList(key);});});});}

// --- Actions ---
function addTodo(){const input=document.getElementById('todoInput'),text=input.value.trim();if(!text||!selectedDate)return;const key=dateKey(selectedDate);
  if(currentRepeat!=='none'){recurring.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text,priority:currentPriority,repeat:currentRepeat,startDate:key,created:new Date().toISOString()});}
  else{if(!todos[key])todos[key]=[];todos[key].push({text,done:false,priority:currentPriority,created:new Date().toISOString()});}
  saveTodos();input.value='';renderProgress(key);renderPanelTodoList(key);render();}

function toggleTodo(key,realIdx,isRec,rid){
  if(isRec){if(!todos[key])todos[key]=[];const ex=todos[key].find(t=>t.recurringId===rid);if(ex)ex.done=!ex.done;else todos[key].push({recurringId:rid,done:true,text:'',priority:'low'});}
  else{const nonRec=(todos[key]||[]).filter(t=>!t.recurringId);if(nonRec[realIdx])nonRec[realIdx].done=!nonRec[realIdx].done;}
  saveTodos();renderProgress(key);renderPanelTodoList(key);render();checkAllDone(key);}

function checkAllDone(key){const dt=getTodosForDay(key);if(dt.length>0&&dt.every(t=>t.done))launchConfetti();}

function deleteTodo(key,realIdx){if(!todos[key])return;const nri=[];todos[key].forEach((t,i)=>{if(!t.recurringId)nri.push(i);});const ai=nri[realIdx];if(ai===undefined)return;todos[key].splice(ai,1);if(todos[key].length===0)delete todos[key];saveTodos();renderProgress(key);renderPanelTodoList(key);render();}
function deleteRecurring(id){recurring=recurring.filter(r=>r.id!==id);Object.keys(todos).forEach(k=>{todos[k]=(todos[k]||[]).filter(t=>t.recurringId!==id);if(todos[k].length===0)delete todos[k];});saveTodos();if(selectedDate){const key=dateKey(selectedDate);renderProgress(key);renderPanelTodoList(key);}render();}

function setPriority(p){currentPriority=p;document.querySelectorAll('.priority-btn').forEach(b=>b.classList.toggle('active',b.classList.contains(p)));}
function setRepeat(r){currentRepeat=r;document.querySelectorAll('.repeat-btn').forEach(b=>b.classList.toggle('active',b.dataset.r===r));}
function changeMonth(delta){if(currentView==='week')currentDate.setDate(currentDate.getDate()+delta*7);else currentDate.setMonth(currentDate.getMonth()+delta);render();}
function goToday(){currentDate=new Date();render();}
function handleInputKey(e){if(e.key==='Enter')addTodo();}

// --- Undo System ---
let undoStack=[];
let undoTimeout=null;
function pushUndo(msg,undoFn){
  undoStack=[{msg,fn:undoFn}]; // Keep only last action
  const toast=document.getElementById('undoToast');
  document.getElementById('undoMsg').textContent=msg;
  toast.classList.add('show');
  const fill=document.getElementById('undoTimerFill');
  fill.style.transition='none';fill.style.width='100%';
  requestAnimationFrame(()=>{fill.style.transition='width 5s linear';fill.style.width='0%';});
  clearTimeout(undoTimeout);
  undoTimeout=setTimeout(()=>{toast.classList.remove('show');undoStack=[];},5000);
}
function performUndo(){
  if(undoStack.length===0)return;
  const action=undoStack.pop();action.fn();
  document.getElementById('undoToast').classList.remove('show');
  clearTimeout(undoTimeout);
  saveTodos();render();
  if(selectedDate){const key=dateKey(selectedDate);renderProgress(key);renderPanelTodoList(key);}
}

// Override deleteTodo to support undo
const _origDeleteTodo=deleteTodo;
deleteTodo=function(key,realIdx){
  if(!todos[key])return;
  const nri=[];todos[key].forEach((t,i)=>{if(!t.recurringId)nri.push(i);});
  const ai=nri[realIdx];if(ai===undefined)return;
  const removed=todos[key][ai];
  const removedIdx=ai;
  todos[key].splice(ai,1);if(todos[key].length===0)delete todos[key];
  saveTodos();renderProgress(key);renderPanelTodoList(key);render();
  pushUndo(`"${removed.text.slice(0,30)}" deleted`,()=>{
    if(!todos[key])todos[key]=[];
    todos[key].splice(removedIdx,0,removed);
  });
};

// --- Search ---
function openSearch(){
  document.getElementById('searchOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('searchInput').focus(),100);
}
function closeSearch(){
  document.getElementById('searchOverlay').classList.remove('open');
  document.getElementById('searchInput').value='';
  document.getElementById('searchResults').innerHTML='<div class="search-empty">Type to search across all days</div>';
}
function performSearch(query){
  const results=document.getElementById('searchResults');
  if(!query.trim()){results.innerHTML='<div class="search-empty">Type to search across all days</div>';return;}
  const q=query.toLowerCase();
  let matches=[];
  // Search regular todos
  Object.entries(todos).forEach(([key,items])=>{
    items.forEach(t=>{
      if(t.recurringId)return;
      if(t.text&&t.text.toLowerCase().includes(q)){matches.push({key,text:t.text,done:t.done,notes:t.notes});}
      else if(t.notes&&t.notes.toLowerCase().includes(q)){matches.push({key,text:t.text,done:t.done,notes:t.notes,matchInNotes:true});}
    });
  });
  // Search recurring
  recurring.forEach(r=>{if(r.text.toLowerCase().includes(q))matches.push({key:r.startDate,text:r.text+' (recurring)',done:false});});
  // Search inbox
  const inbox=JSON.parse(localStorage.getItem('todo-calendar-inbox')||'[]');
  inbox.forEach(t=>{if(t.text.toLowerCase().includes(q))matches.push({key:'inbox',text:t.text,done:t.done});});

  if(matches.length===0){results.innerHTML='<div class="search-empty">No results found</div>';return;}
  // Sort by date descending
  matches.sort((a,b)=>b.key.localeCompare(a.key));
  results.innerHTML=matches.slice(0,20).map(m=>{
    const highlighted=m.text.replace(new RegExp(`(${escapeHtml(query)})`,'gi'),'<mark>$1</mark>');
    const dateTxt=m.key==='inbox'?'Inbox':new Date(m.key+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
    return`<div class="search-result-item" onclick="${m.key==='inbox'?"setView('inbox');closeSearch();":`openDay('${m.key}');closeSearch();`}"><span class="sr-text ${m.done?'sr-done':''}">${highlighted}</span><span class="sr-date">${dateTxt}</span></div>`;
  }).join('')+(matches.length>20?`<div class="search-empty">+${matches.length-20} more results</div>`:'');
}

// --- Inbox (undated todos) ---
function getInbox(){return JSON.parse(localStorage.getItem('todo-calendar-inbox')||'[]');}
function saveInbox(inbox){localStorage.setItem('todo-calendar-inbox',JSON.stringify(inbox));updateInboxBadge();}
function updateInboxBadge(){
  const inbox=getInbox();const badge=document.getElementById('inboxBadge');
  const pending=inbox.filter(t=>!t.done).length;
  if(pending>0){badge.textContent=pending;badge.style.display='inline';}else{badge.style.display='none';}
}
function renderInboxView(){
  const inbox=getInbox();const container=document.getElementById('inboxContent');
  let html=`<div style="max-width:560px;margin:0 auto;padding:20px 0">
    <h2 style="font-size:1.3rem;font-weight:800;margin-bottom:4px">Inbox</h2>
    <p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:20px">Undated tasks. Drag them to a day when ready.</p>
    <div class="add-todo-input-row" style="margin-bottom:16px">
      <input type="text" id="inboxInput" placeholder="Capture a thought..." onkeydown="if(event.key==='Enter')addInboxTodo()" maxlength="500" style="background:var(--bg-secondary);border:1px solid var(--border);color:var(--text-primary);padding:12px 16px;border-radius:10px;font-size:0.87rem;outline:none;flex:1">
      <button onclick="addInboxTodo()" style="background:var(--gradient-green);border:none;color:#fff;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:600;font-size:0.84rem">Add</button>
    </div>`;
  if(inbox.length===0){html+=`<div class="empty-state"><div class="empty-state-icon">&#128230;</div>Inbox empty. Capture ideas here without a date.</div>`;}
  else{
    html+='<div class="todo-list">';
    inbox.forEach((t,i)=>{
      html+=`<div class="todo-item${t.done?' done':''}" draggable="true" ondragstart="startInboxDrag(event,${i})">
        <input type="checkbox" ${t.done?'checked':''} onchange="toggleInboxTodo(${i})" aria-label="${escapeHtml(t.text)}">
        <div class="todo-item-content"><span class="todo-text">${escapeHtml(t.text)}</span></div>
        <button class="delete-btn" onclick="deleteInboxTodo(${i})" aria-label="Delete">&#10005;</button>
      </div>`;
    });
    html+='</div>';
  }
  html+='</div>';container.innerHTML=html;
  setTimeout(()=>{const inp=document.getElementById('inboxInput');if(inp)inp.focus();},100);
}
function addInboxTodo(){
  const input=document.getElementById('inboxInput');if(!input)return;
  const text=input.value.trim();if(!text)return;
  const inbox=getInbox();inbox.push({text,done:false,priority:'low',created:new Date().toISOString()});
  saveInbox(inbox);input.value='';renderInboxView();
}
function toggleInboxTodo(idx){const inbox=getInbox();if(inbox[idx])inbox[idx].done=!inbox[idx].done;saveInbox(inbox);renderInboxView();}
function deleteInboxTodo(idx){
  const inbox=getInbox();const removed=inbox.splice(idx,1)[0];saveInbox(inbox);renderInboxView();
  pushUndo(`"${removed.text.slice(0,30)}" deleted`,()=>{const ib=getInbox();ib.splice(idx,0,removed);saveInbox(ib);if(currentView==='inbox')renderInboxView();});
}
function startInboxDrag(e,idx){
  const inbox=getInbox();const todo=inbox[idx];
  draggedTodo={key:'inbox',realIdx:idx,todo:{...todo}};
  e.dataTransfer.setData('text/plain','cross-day');e.dataTransfer.effectAllowed='move';
}
// handleCalendarDrop - handles both inbox and cross-day drops
function handleCalendarDrop(e,targetKey){
  e.preventDefault();e.currentTarget.classList.remove('drop-target');
  if(!draggedTodo)return;
  if(draggedTodo.key==='inbox'){
    const inbox=getInbox();inbox.splice(draggedTodo.realIdx,1);saveInbox(inbox);
    if(!todos[targetKey])todos[targetKey]=[];todos[targetKey].push(draggedTodo.todo);
    draggedTodo=null;saveTodos();render();if(currentView==='inbox')renderInboxView();return;
  }
  if(draggedTodo.key===targetKey){draggedTodo=null;return;}
  const srcArr=todos[draggedTodo.key]||[];const nri=[];srcArr.forEach((t,i)=>{if(!t.recurringId)nri.push(i);});
  const actualIdx=nri[draggedTodo.realIdx];
  if(actualIdx!==undefined){srcArr.splice(actualIdx,1);if(srcArr.length===0)delete todos[draggedTodo.key];else todos[draggedTodo.key]=srcArr;}
  if(!todos[targetKey])todos[targetKey]=[];todos[targetKey].push(draggedTodo.todo);
  draggedTodo=null;saveTodos();render();
  if(selectedDate){const key=dateKey(selectedDate);renderProgress(key);renderPanelTodoList(key);}
}

// --- Carry Forward ---
function checkCarryForward(){
  const banner=document.getElementById('carryForwardBanner');
  const today=new Date();today.setHours(0,0,0,0);
  const yesterday=new Date(today);yesterday.setDate(yesterday.getDate()-1);
  let overdueTodos=[];
  // Check last 7 days for incomplete todos
  for(let i=1;i<=7;i++){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const key=dateKey(d);const dt=(todos[key]||[]).filter(t=>!t.recurringId&&!t.done);
    overdueTodos.push(...dt.map(t=>({...t,fromKey:key})));
  }
  if(overdueTodos.length===0){banner.innerHTML='';return;}
  banner.innerHTML=`<div class="carry-forward-banner">
    <span>&#9888; You have <strong>${overdueTodos.length}</strong> unfinished task${overdueTodos.length>1?'s':''} from the past week</span>
    <button onclick="carryForwardAll()">Move to Today</button>
  </div>`;
}
function carryForwardAll(){
  const today=new Date();today.setHours(0,0,0,0);
  const todayKey=dateKey(today);
  for(let i=1;i<=7;i++){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const key=dateKey(d);if(!todos[key])continue;
    const toMove=todos[key].filter(t=>!t.recurringId&&!t.done);
    const toKeep=todos[key].filter(t=>t.recurringId||t.done);
    if(toMove.length>0){
      if(!todos[todayKey])todos[todayKey]=[];
      todos[todayKey].push(...toMove);
      if(toKeep.length===0)delete todos[key];else todos[key]=toKeep;
    }
  }
  saveTodos();render();document.getElementById('carryForwardBanner').innerHTML='';
}

// --- Keyboard Shortcuts ---
document.addEventListener('keydown',e=>{
  // Don't trigger if typing in input
  const isInput=e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable;
  if(e.key==='Escape'){closePanel();closeFocusMode();closeSearch();return;}

  if(!isInput){
    if(e.key==='/'){e.preventDefault();openSearch();return;}
    if(e.key==='n'||e.key==='N'){e.preventDefault();const todayKey=dateKey(new Date());openDay(todayKey);return;}
    if(e.key==='i'||e.key==='I'){e.preventDefault();setView('inbox');return;}
    if(e.key==='f'||e.key==='F'){e.preventDefault();openFocusMode();return;}
    if(e.key==='?'){e.preventDefault();const h=document.getElementById('shortcutsHint');h.style.opacity=h.style.opacity==='0'?'1':'0';return;}
  }

  if(selectedDate&&document.getElementById('panel').style.display==='flex'&&!isInput){
    if(e.key==='ArrowLeft'){e.preventDefault();navDay(-1);}
    if(e.key==='ArrowRight'){e.preventDefault();navDay(1);}
  }
});

// --- View switching (updated to include inbox) ---
const _origSetView=setView;
setView=function(v){
  currentView=v;
  document.getElementById('monthView').style.display=v==='month'?'block':'none';
  document.getElementById('weekView').style.display=v==='week'?'block':'none';
  document.getElementById('inboxView').style.display=v==='inbox'?'block':'none';
  document.getElementById('viewMonthBtn').classList.toggle('btn-active',v==='month');
  document.getElementById('viewWeekBtn').classList.toggle('btn-active',v==='week');
  document.getElementById('inboxBtn').classList.toggle('btn-active',v==='inbox');
  if(v==='inbox')renderInboxView();
  else render();
};

// --- Init ---
updateInboxBadge();
setView('month');
setTimeout(checkCarryForward,500);
function openFocusMode(){
  const overlay=document.getElementById('focusOverlay');
  overlay.classList.add('open');
  const today=new Date();
  document.getElementById('focusTitle').textContent=today.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  renderFocusView();
}
function closeFocusMode(){document.getElementById('focusOverlay').classList.remove('open');}
function renderFocusView(){
  const key=dateKey(new Date());const dt=getTodosForDay(key);const container=document.getElementById('focusContent');
  if(dt.length===0){container.innerHTML='<div class="focus-empty">Nothing planned for today. Enjoy your free day!</div><div style="text-align:center;margin-top:20px"><input class="week-add-input" style="max-width:300px;padding:12px 16px;font-size:0.9rem;border-radius:10px" placeholder="Add a task for today..." onkeydown="focusQuickAdd(event)"></div>';return;}
  const done=dt.filter(t=>t.done).length,pct=Math.round((done/dt.length)*100);
  const color=pct===100?'var(--green)':pct>=50?'var(--accent)':'var(--orange)';
  let html=`<div class="focus-progress"><div class="big-pct" style="color:${color}">${pct}%</div><div class="sub">${done} of ${dt.length} tasks completed</div></div>`;
  html+=`<div style="margin-bottom:16px"><input class="week-add-input" style="padding:12px 16px;font-size:0.88rem;border-radius:10px" placeholder="Add a task..." onkeydown="focusQuickAdd(event)"></div>`;
  html+='<div class="focus-todo-list">';
  dt.forEach((t,i)=>{
    const doneCls=t.done?' done':'';const isRec=!!t.isRecurring;
    const prioHtml=t.priority!=='low'?`<span class="focus-prio" style="background:${t.priority==='high'?'var(--red-dim)':'var(--orange-dim)'};color:${t.priority==='high'?'var(--red)':'var(--orange)'}">${t.priority}</span>`:'';
    html+=`<div class="focus-todo-item${doneCls}" style="animation-delay:${i*0.05}s"><input type="checkbox" ${t.done?'checked':''} onchange="toggleFocusTodo(${i},${isRec},'${t.id||''}')" aria-label="${escapeHtml(t.text)}"><span class="focus-text">${escapeHtml(t.text)}</span>${prioHtml}<button class="delete-btn" onclick="deleteFocusTodo(${i},${isRec},'${t.id||''}')" style="opacity:0.6;font-size:0.9rem;padding:4px 8px;border:none;background:none;color:var(--text-muted);cursor:pointer" aria-label="Delete">&#10005;</button></div>`;
  });
  html+='</div>';container.innerHTML=html;
}
function toggleFocusTodo(idx,isRec,rid){
  const key=dateKey(new Date());
  if(isRec){if(!todos[key])todos[key]=[];const ex=todos[key].find(t=>t.recurringId===rid);if(ex)ex.done=!ex.done;else todos[key].push({recurringId:rid,done:true,text:'',priority:'low'});}
  else{const nonRec=(todos[key]||[]).filter(t=>!t.recurringId);if(nonRec[idx])nonRec[idx].done=!nonRec[idx].done;}
  saveTodos();renderFocusView();render();checkAllDone(key);
}
function deleteFocusTodo(idx,isRec,rid){
  const key=dateKey(new Date());
  if(isRec){deleteRecurring(rid);renderFocusView();return;}
  const nri=[];(todos[key]||[]).forEach((t,i)=>{if(!t.recurringId)nri.push(i);});
  const ai=nri[idx];if(ai===undefined)return;
  todos[key].splice(ai,1);if(todos[key].length===0)delete todos[key];
  saveTodos();renderFocusView();render();
}
function focusQuickAdd(e){
  if(e.key!=='Enter'||!e.target.value.trim())return;
  const key=dateKey(new Date());
  if(!todos[key])todos[key]=[];
  todos[key].push({text:e.target.value.trim(),done:false,priority:'low',created:new Date().toISOString()});
  e.target.value='';saveTodos();renderFocusView();render();
}

// --- Notes on Todos ---
function toggleNotes(key,realIdx){
  const existing=document.getElementById(`notes-${key}-${realIdx}`);
  if(existing){saveNote(key,realIdx);existing.remove();return;}
  // Close other open notes
  document.querySelectorAll('.todo-notes').forEach(n=>n.remove());
  const item=document.querySelector(`.todo-item[data-real-idx="${realIdx}"][data-key="${key}"]`);
  if(!item)return;
  const nonRec=(todos[key]||[]).filter(t=>!t.recurringId);
  const todo=nonRec[realIdx];if(!todo)return;
  const notesDiv=document.createElement('div');
  notesDiv.className='todo-notes';notesDiv.id=`notes-${key}-${realIdx}`;
  notesDiv.innerHTML=`<textarea placeholder="Add notes, links, details..." onblur="saveNote('${key}',${realIdx})">${escapeHtml(todo.notes||'')}</textarea><div class="todo-notes-hint">Click outside to save</div>`;
  item.querySelector('.todo-item-content').appendChild(notesDiv);
  notesDiv.querySelector('textarea').focus();
}
function saveNote(key,realIdx){
  const el=document.getElementById(`notes-${key}-${realIdx}`);if(!el)return;
  const text=el.querySelector('textarea').value;
  const nri=[];(todos[key]||[]).forEach((t,i)=>{if(!t.recurringId)nri.push(i);});
  const actualIdx=nri[realIdx];if(actualIdx===undefined)return;
  todos[key][actualIdx].notes=text;saveTodos();
}

// --- Cross-day Drag ---
let draggedTodo=null;
function startCrossDayDrag(e,key,realIdx){
  const nonRec=(todos[key]||[]).filter(t=>!t.recurringId);
  const todo=nonRec[realIdx];if(!todo)return;
  draggedTodo={key,realIdx,todo:{...todo}};
  e.dataTransfer.setData('text/plain','cross-day');
  e.dataTransfer.effectAllowed='move';
  e.target.classList.add('dragging');
}
function handleCalendarDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';}
function handleCalendarDragEnter(e){
  const cell=e.currentTarget;cell.classList.add('drop-target');
}
function handleCalendarDragLeave(e){
  const cell=e.currentTarget;cell.classList.remove('drop-target');
}

</script>

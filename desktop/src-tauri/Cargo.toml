[package]
name = "almanac-widget"
version = "0.1.0"
description = "Always-on-top desktop widget for Almanac todo calendar"
authors = ["abhinav-kipper"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

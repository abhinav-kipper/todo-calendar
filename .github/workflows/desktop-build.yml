name: Build desktop widget

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build universal .app + .dmg
        working-directory: desktop
        run: cargo tauri build --target universal-apple-darwin

      - name: Zip the .app
        working-directory: desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos
        run: zip -r Almanac.app.zip Almanac.app

      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: almanac-widget-macos
          path: |
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Almanac.app.zip
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Publish to a GitHub Release (only on tag pushes)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Almanac.app.zip
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          generate_release_notes: true
